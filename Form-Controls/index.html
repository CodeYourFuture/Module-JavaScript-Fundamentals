<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>My form exercise</title>
  <meta name="description" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body>
  <header>
    <h1>Product Pick</h1>
  </header>

  <main>

    <form>
      <fieldset>
        <legend>Customer Information</legend>
        <br>

        <div>
          <label for="txt">User name</label>
          <input id="txt" type="text" placeholder="please insert a valid name" minlength="2" required>
        </div>
        <br>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password"
            placeholder="please insert a valid password contains at least 8 characters" minlength="8" required>
        </div>

        <div>
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="please insert a valid email/Ex:adbsefg@ghh.com" required>
        </div>

      </fieldset>

      <br>
      <fieldset>
        <legend>Product Information</legend>

        <div>
          <label for="colour">Select colour</label>
          <input list="colour"  required>
          <datalist id="colour">

            <option value="red">
            <option value="blue">
            <option value="green">

          </datalist>

        </div>

        <div>

          <label for="size">Select size</label>
          <select name="size" id="size">

            <option value="XS">xs</option>
            <option value="S">s</option>
            <option value="M">M </option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
          </select>
          </dive>
          <div>
            <label for="quantity">Select quantity</label>
            <input type="number" Id="quantity" min="1" max="100" required>
          </div>

          <br>
          <hr>
          <div>
            <label for="submit">submit</label>
            <input id="submit" type="submit" value="send">
          </div>
      </fieldset>


    </form>
  </main>
  <footer>
    <h3>
      By Mona_Eltantawy

    </h3>

  </footer>
</body>

</html>
