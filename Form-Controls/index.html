<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <!-- Fieldset added for form structure-->
        <fieldset>
          <legend>Personal Details</legend>
          <!-- name field added -->
          <div>
            <label for="name">Name:</label>
            <input 
              type="text" 
              id="name"
              name="name"
              placeholder="Ada Lovelace"
              title="Please enter your name"
              pattern=".*\S.*\S.*"
              />
          </div>

          <!-- email field added -->
          <div>
            <label for="email">Email:</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              placeholder="ada.lovelace@example.com" 
              title="Please enter a valid email"   
              pattern=".*\S.*@.*\S.*"
              required
            />
          </div>
        </fieldset>

        
        <fieldset>
          <legend>T-shirt Information</legend>
          <!-- T-shirt colour information added -->

          <div>
            <label for="colour">Colour:</label>

            <select id="colour" name="colour" required>
              <option value="">Select a colour</option>
              <option value="black">Black</option>
              <option value="blue">Blue</option>
              <option value="white">White</option>
            </select>
          </div>

          <!-- T-shirt size information added -->
          <div>
            <label for="size">Size:</label>

            <select id="size" name="size" required>
              <option value="">Choose your size</option>
              <option value="xs">XS</option>
              <option value="s">S</option>
              <option value="m">M</option>
              <option value="l">L</option>
              <option value="xl">XL</option>
              <option value="xxl">XXL</option>
            </select>
          </div>
        </fieldset>
        <!-- submit and reset added  -->
        <div>
          <button type="submit">Submit</button>
          <button type="reset">Clear form</button>
        </div>
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <p>By Edina Kurdi - HOMEWORK SOLUTION</p>
    </footer>
  </body>
</html>
