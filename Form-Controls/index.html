<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <center>
      <header>
        <h1>Product Pick</h1>
      </header>

      <main>
        <form>
          <fieldset>
            <legend align="center">Customer Information</legend>

            <label for="name">Name:</label>
            <input
              type="text"
              id="name"
              name="name"
              pattern="[A-Za-z\s]+"
              title="Please enter a valid name (letters and spaces only)."
              minlength="2"
              required
            />
            <br /><br />

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required />
            <br /><br />
            <fieldset>
            <legend align="center">T-Shirt Colour: </legend>
            <br />
            <input
              type="radio"
              id="white"
              name="color"
              value="white"
              required
            />
            <label for="white">White</label>

            <br />
            <input
              type="radio"
              id="black"
              name="color"
              value="black"
              required
            />
            <label for="black">Black</label>
            <br />
            <input
              type="radio"
              id="green"
              name="color"
              value="green"
              required
            />
            <label for="green">Green</label>
            </fieldset>
            <br /><br />
            <label for="size">T-Shirt Size: </label>
            <select id="size" name="size" required>
              <option value="" disabled selected>-- Please Choose Size --</option>
              <option value="XS">XS</option>
              <option value="S">S</option>
              <option value="M">M</option>
              <option value="L">L</option>
              <option value="XL">XL</option>
              <option value="XXL">XXL</option>
            </select>
            <br /><br />
              <button type="submit">Submit Order</button>
          </fieldset>
        </form>
      </main>

      <footer>
        <h2>By Maher Abou Albourgol - 2025 September Cohort - London</h2>
      </footer>
    </center>
  </body>
</html>
