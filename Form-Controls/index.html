<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>My form exercise</title>
  <meta name="description" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body>
  <header>
    <h1>Product Pick</h1>
  </header>
  <main>
    <form>

      <div>
        <label>
          Name
          <input type="text" name="name" id="name" placeholder="username" minlength="2" required pattern=".*\S.*"
            title="Name must contain at least one non-space character" />
        </label>
      </div>

      <div>
        <label>
          Email
          <input type="email" name="email" id="email" required />
        </label>
      </div>

      <fieldset>
        <legend>Choose a Colour </legend>
        <div>
          <label>
            Red
            <input type="radio" name="colour" value="red" required />
          </label>
        </div>

        <div>
          <label>
            Green
            <input type="radio" name="colour" value="green" />
          </label>
        </div>

        <div>
          <label>
            Blue
            <input type="radio" name="colour" value="blue" />
          </label>
        </div>
      </fieldset>


      <div>
        <label>
          Size
          <select name="Size" id="Sizes" required>
            <option value="">Select a size </option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
          </select>
        </label>
      </div>

      <button type="reset">Reset</button>
      <button type="submit">Submit</button>
    </form>
  </main>
  <footer>
    <!-- change to your name-->
    <h2>By GLORIA MANKRADO</h2>
  </footer>
</body>

</html>
