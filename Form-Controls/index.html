<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <div>
          <label>
            Name:
            <input type="text" placeholder="Enter your name" minlength="2" required>
          </label>
        </div>
        <br>
        <div>
          <label>
            Email:
            <input type="email" placeholder="Enter your email" required>
          </label>
        </div>
        <br>
        <div>
          <label for="colour_select">Choose t-shirt colour</label>
          <select name="colour" id="colour_select" required>
            <option value="">--Please choose an option--</option>
            <option value="blue">Blue</option>
            <option value="red">Red</option>
            <option value="black">Black</option>
          </select>
        </div>
        <br>
          <fieldset>
            <legend>Choose t-shirt size</legend>
            <div>
              <input type="radio" name="size" id="xs" value="xs" required>
              <label for="xs">XS</label>
            </div><br>
            <div>
              <input type="radio" name="size" id="s" value="s">
              <label for="s">S</label>
            </div><br>
            <div>
              <input type="radio" name="size" id="m" value="m">
              <label for="m">M</label>
            </div><br>
            <div>
              <input type="radio" name="size" id="l" value="l">
              <label for="l">L</label>
            </div><br>
            <div>
              <input type="radio" name="size" id="xl" value="xl">
              <label for="xl">XL</label>
            </div><br>
            <div>
              <input type="radio" name="size" id="xxl" value="xxl">
              <label for="xxl">XXL</label>
            </div>
          </fieldset>
          <!--
    Requirements:
    1. Collect customer's name (required, min 2 characters)
    2. Collect customer's email (required, valid email)
    3. Choose t-shirt colour (3 options only, required)
    4. Choose t-shirt size (XS, S, M, L, XL, XXL, required)
    5. All inputs must have labels
    6. HTML only, no CSS, no JS
  -->
      </form>
    </main>
    <footer>
      <h2>By Elisabeth Matulian</h2>
    </footer>
  </body>
</html>
