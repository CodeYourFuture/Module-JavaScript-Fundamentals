<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Khor Biel's Online Store</title>
  <meta name="description" content="Order your t-shirt by entering your details, preferred colour, and size." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <a href="#main-content">Skip to main content</a>

  <header>
    <h1>Product Pick</h1>
  </header>

  <main id="main-content">
    <form aria-label="T-shirt order form">
      <fieldset>
        <legend>Customer Information</legend>

        <label for="first_name">First Name:</label>
        <input type="text" id="first_name" name="first_name" required minlength="2" />

        <label for="last_name">Last Name:</label>
        <input type="text" id="last_name" name="last_name" required minlength="2" />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
      </fieldset>
      <fieldset>
        <legend>Product Information</legend>
        <fieldset>
          <legend>T-shirt Color</legend>
          <div>
            <input type="radio" id="color-red" name="color" value="red" required />
            <label for="color-red">Red</label>
          </div>
          <div>
            <input type="radio" id="color-blue" name="color" value="blue" />
            <label for="color-blue">Blue</label>
          </div>
          <div>
            <input type="radio" id="color-green" name="color" value="green" />
            <label for="color-green">Green</label>
          </div>
        </fieldset>
        <fieldset>
          <legend>T-shirt Size</legend>
          <div>
            <input type="radio" id="size-xs" name="size" value="XS" required />
            <label for="size-xs">XS</label>
          </div>
          <div>
            <input type="radio" id="size-s" name="size" value="S" />
            <label for="size-s">S</label>
          </div>
          <div>
            <input type="radio" id="size-m" name="size" value="M" />
            <label for="size-m">M</label>
          </div>
          <div>
            <input type="radio" id="size-l" name="size" value="L" />
            <label for="size-l">L</label>
          </div>
          <div>
            <input type="radio" id="size-xl" name="size" value="XL" />
            <label for="size-xl">XL</label>
          </div>
          <div>
            <input type="radio" id="size-xxl" name="size" value="XXL" />
            <label for="size-xxl">XXL</label>
          </div>
        </fieldset>
      </fieldset>
      <button type="reset">Reset</button>
      <button type="submit">Submit</button>
    </form>
  </main>

  <footer>
    <p><strong>BY KHOR BIEL</strong></p>
  </footer>
</body>
</html>
