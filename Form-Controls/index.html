<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Product Pick</title>
    <meta name="description" content="Product selection form" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>

    <main>
      <form>
        <label for="customer-name">Customer Name:</label><br />
        <input
          type="text"
          id="customer-name"
          name="customer-name"
          minlength="2"
          required
        /><br /><br />
        <label for="customer-email">Email Address:</label><br />
        <input
          type="email"
          id="customer-email"
          name="customer-email"
          required
        /><br /><br />
        <fieldset>
          <legend>Choose a T-shirt Color:</legend>
          <label>
            <input
              type="radio"
              name="color"
              value="red"
              required
            />Red</label
          >
          <label>
          <input type="radio" name="color" value="blue" />
          >Blue</label>
          <label>
          <input type="radio" name="color" value="green" />
          >Green</label>
        </fieldset>
        <br />
        <label for="size">Select Size:</label>
        <select id="size" name="size" required>
          <option value="">--Select Size--</option>
          <option value="XS">XS</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL (Extra Extra Large)</option>
        </select>

        <button type="submit">Submit</button>
      </form>
    </main>
    <footer>
      <p>Pretty N. Taruvinga</p>
    </footer>
  </body>
</html>
