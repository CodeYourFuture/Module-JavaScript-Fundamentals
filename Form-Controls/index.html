<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
       <!-- Name Input -->
       <div>
        <label for="name">Name</label>
        <input type="text" name="name" id="name" minlength="2" required>
       </div>
       <br>

       <!-- Email Input -->
       <div>
        <label for="email">Email</label>
        <input type="email" name="email" id="email" required>
       </div>
       <br>

       <!-- Color Select -->
       <div>
        <label for="colour">Colour</label>
       </div>
       <div>
        <label for="red">Red</label>
        <input type="radio" name="colour" id="red" value="red" required>
        <label for="green">Green</label>
        <input type="radio" name="colour" id="green" value="green">
        <label for="blue">Blue</label>
        <input type="radio" name="colour" id="blue" value="blue">
       </div>
       <br>

       <!-- Size Select -->
       <div>
        <label for="size">Size</label>
        <select name="size" id="size" required>
          <option value="" selected>Select Size</option>
          <option value="XS">XS</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
        </select>
       </div>
       <br>

       <!-- Submit & Reset buttons -->
       <button type="reset">Reset</button>
       <button type="submit">Submit</button>
      </form>
    </main>
    <footer>
      <p>By Alex Jamshidi</p>
    </footer>
  </body>
</html>
