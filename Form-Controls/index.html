<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>My form exercise</title>
    <meta name="description" content="A simple form exercise"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required pattern=".*\S.*\S.*"><br><br>
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required><br><br>
          <fieldset>
            <legend>T-Shirt Color:</legend>
            <label><input type="radio" id="red" name="color" value="red" required>
            red </label><br>
            <label><input type="radio" id="blue" name="color" value="blue">
            blue </label><br>
            <label><input type="radio" id="green" name="color" value="green">
            green </label><br>
          </fieldset><br>
          <fieldset>
            <legend>T-Shirt Size:</legend>
            <input type="radio" id="extra-small" name="size" value="XS" required>
            <label for="extra-small">XS</label><br>
            <input type="radio" id="small" name="size" value="S">
            <label for="small">S</label><br>
            <input type="radio" id="medium" name="size" value="M">
            <label for="medium">M</label><br>
            <input type="radio" id="large" name="size" value="L">
            <label for="large">L</label><br>
            <input type="radio" id="extra-large" name="size" value="XL">
            <label for="extra-large">XL</label><br>
            <input type="radio" id="extra-extra-large" name="size" value="XXL">
            <label for="extra-extra-large">XXL</label><br>
          </fieldset><br>
          <input type="submit" value="Place Order">
      </form>
    </main>
    <footer>
      <p>By Fatima Rouchi</p>
    </footer>
  </body>
</html>
