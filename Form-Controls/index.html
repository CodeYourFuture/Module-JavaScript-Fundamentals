<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <fieldset>
          <legend>Order Form</legend>
          <!--Name at least 2 non space characters-->
            <label for="name">Name</label>
              <input type="text" name="name" id="name" pattern=".*\S.*\S.*" placeholder="James" required>
        <!--EMAIL-->
            <label for="email">Email Address</label>
              <input type="email" name="email" id="email" required placeholder="myemail@email.com">
        <!--Color 3 options with select NO multiselect-->
            <label for="colorOptions">Choose Color</label>
              <select id="colorOptions" name="color" required>
                <option hidden></option>
                <option value="grey" >Grey</option>
                <option value="black" >Black</option>
                <option value="white" >White</option>
              </select>

        <!--SIZE 6 options XS,S,M,L,XL,XXL-->
        <p>Choose Size:</p>

        <div id="sizeDiv">

          <div id="xsDiv">
        <label for="xs">XS</label>
          <input type="radio" id="xs" name="size" value="xs" required>
          </div>

        <div id="sDiv">
        <label for="s">S</label>
          <input type="radio" id="s" name="size" value="s">
        </div>

        <div id="mDiv">
        <label for="m">M</label>
          <input type="radio" id="m" name="size" value="m">
        </div>

        <div id="lDiv">
        <label for="l">L</label>
          <input type="radio" id="l" name="size" value="l">
        </div>

        <div id="xlDiv">
        <label for="xl">XL</label>
          <input type="radio" id="xl" name="size" value="xl">
        </div>

        <div id="xxlDiv">
        <label for="xxl">XXL</label>
          <input type="radio" id="xxl" name="size" value="xxl">
        </div>
        </div>

        </fieldset>

        <div id="buttonGroup">
          <button type="submit">Submit</button>
          <button type="reset">Reset</button>
        </div>

      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <p>By Bartosz Kawiak</p>
    </footer>
  </body>
</html>
