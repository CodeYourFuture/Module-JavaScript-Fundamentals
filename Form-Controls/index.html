<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Ordering T-Shirt Form</title>
  <meta name="description" content="T-shirt Ordering Form">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
  <header>
    <h1>T-shirt Ordering Form</h1>
  </header>
  <main>
    <form>
      <fieldset>
        <legend><strong>Information</strong></legend>
        <div>
          <label for="name"> Name</label>
          <input type="text" name="name" id="name" placeholder="enter your name" required minlength="2"
            maxlength="20"><br><br>
        </div>
        <div>
          <label for="e-mail">e-mail</label>
          <input type="email" name="e-mail" id="e-mail" placeholder="enter your email" required>
        </div>
      </fieldset> <br>

      <fieldset>
        <legend><strong>T-Shirt's Colour</strong></legend>
        <p>What colour should the t-shirt be?</p>
        <div>
          <label for="red"> Red </label>
          <input type="radio" name="color" id="red" value="red">
        </div>
        <br>
        <div>
          <label for="yellow"> Yellow </label>
          <input type="radio" name="color" id="yellow" value="yellow">
        </div>
        <br>
        <div>
          <label for="black"> Black </label>
          <input type="radio" name="color" id="black" value="black">
        </div>
      </fieldset> <br>
      <fieldset>
        <legend><strong>T-Shirt's Size</strong></legend>
        <p>What size should the t-shirt be?</p>
        <div>
          <label for="size"> size: </label>
          <select id="size" name="size" required>
            <option value="" disabled selected>-</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
          </select>
        </div>
      </fieldset><br>

      <button type="reset" aria-label="Reset the form">Reset</button>
      <button type="submit" aria-label="Submit the form">Submit</button>

      <!-- write your html here-->
      <!-- 
          
          My form is semantic html.
          All inputs have associated labels.
          My Lighthouse Accessibility score is 100.
          I require a valid name. I have defined a valid name as a text string of two characters or more.
          I require a valid email.
          I require one colour from a defined set of 3 colours.
          I require one size from a defined set of 6 sizes.
        this will also help you fill in your PR message later-->
    </form>
  </main>
  <footer>
    <!-- change to your name-->
    <h2></small><em>By Shohreh Bayat for Code Your Future</em></h2>
  </footer>
</body>

</html>
