<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>

        <!--
T-SHIRT ORDER FORM REQUIREMENTS

- Only HTML and CSS (no JavaScript)
- Semantic HTML structure
- All inputs must have associated labels
- Accessibility should be high (Lighthouse target: 100)

DATA TO COLLECT:

1. Customer Name
   - Required
   - Must be at least 2 characters

2. Customer Email
   - Required
   - Must be a valid email format

3. T-shirt Colour
   - Required
   - Must choose ONE from 3 options:
     • Black
     • White
     • Blue

4. T-shirt Size
   - Required
   - Must choose ONE from 6 options:
     • XS
     • S
     • M
     • L
     • XL
     • XXL

NOTES:
- Do NOT include a form action
- All fields must be required
-->
<!-- Name -->
    <label for="name">Name:</label>
    <input 
      type="text" 
      id="name" 
      name="name" 
      minlength="2" 
      required
    >

    <br><br>

    <!-- Email -->
    <label for="email">Email:</label>
    <input 
      type="email" 
      id="email" 
      name="email" 
      required
    >

    <br><br>

    <!-- Colour -->
    <label for="colour">Choose Colour:</label>
    <select id="colour" name="colour" required>
      <option value="">Select Colour</option>
      <option value="black">Black</option>
      <option value="white">White</option>
      <option value="blue">Blue</option>
    </select>

    <br><br>

    <!-- Size -->
    <label for="size">Choose Size:</label>
    <select id="size" name="size" required>
      <option value="">Select Size</option>
      <option value="XS">XS</option>
      <option value="S">S</option>
      <option value="M">M</option>
      <option value="L">L</option>
      <option value="XL">XL</option>
      <option value="XXL">XXL</option>
    </select>

    <br><br>

    <button type="submit">Submit Order</button>
        
         
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <p>By SHAFIEK WALKER</p>
    </footer>
  </body>
</html>
