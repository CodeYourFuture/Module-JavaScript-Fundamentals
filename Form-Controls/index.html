<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
      <form action="results.html" method="GET">
        <div>
        <label for="name">Name</label>
        <br>
        <Input type="text" name="name" id="name" minlength="2" required>
        </div>
        <div>
        <label for="email">Email</label>
        <br>
        <Input type="email" name="email" id="email" required>
        </div>
        <div>
        <label for="Tshirtcolour">Tshirt colour</label>
        <br>
        <select name="Tshirtcolour" id="Tshirtcolour" required>
        <option value> Select a colour</option>
        <option value="Red">Red</option>
        <option label="Blue" value="Blue"></option>
        <option label="Yellow"> value="Yellow"</option></select>
        </div>
        <div>
        <label for="Tshirtsize">Tshirt size</label>
        <br>
        <select name="Tshirtsize" id="Tshirtsize" required>
        <option value> Select a size</option>
        <option value="XS">XS</option>
        <option label="S" value="S"></option>
        <option label="M"> value="M"</option>
        <option label="L" value="L"></option>
        <option label="XL"> value="XL"</option>
        <option label="XXL" value="XXL"></option> </select>
        </div>
        <br>
        <button type="reset">Reset</button>
        <br>
        <br>
        <button type="submit">Submit</button>
      <h2>By PRAKASH DCOSTA</h2>
    </footer>
  </body>
</html>
