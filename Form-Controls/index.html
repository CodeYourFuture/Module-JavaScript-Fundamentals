<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>T-shirt Order Form</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css"> 
  </head>
  <body>
    <main>

    <form method="get" class="container"> 
    <header>
      <h1>T-shirt Order Form</h1>
    </header>
    <main>
      <form>

        <div>
        <label for="name">Full Name</label>
        <input id="name" name="name" type="text" minlength="2" placeholder="First Name Surname" required>
        </div>

        <div> 
        <label for="email">Email</label>
        <input id="email" name="email" type="email" pattern="[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$" 
          placeholder="Your email" required>
        </div>

          <div>
            <label for="colour">T-shirt Colour:</label>

            <select name="colour" id="colour" required>
            <option value="">Choose a Colour</option>
            <option value="Red">Red</option>
            <option value="Blue">Blue</option>
            <option value="Yellow">Yellow</option>
           </select> 
          </div>

          <div>
          <label for="Size">T-shirt Size:</label>
          <select name="size" id="Size" required>
            <option value="">Choose a Size</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
          </select>
          </div>

        </div>

        
          <button type="submit">Submit</button>
        </div>

        <!-- write your html here-->
        <!-- 
          try writing out the requirements first as comments
        this will also help you fill in your PR message later-->
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <p>By Lesya Lyaisyan</p>
    </footer>
  </body>
</html>
