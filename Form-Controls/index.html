<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
       <label for="name">Name</label> 
       <input name="name" id="name" type="text" pattern=".*\S.*\S.*" required />
       <label for="email">Email</label>
       <input id="email" name="email" type="email" required />
       <fieldset>
         <legend>T-shirt colour</legend>
             <label>
                  <input type="radio" name="colour" value="black" required />Black
             </label>
             <label>
                  <input type="radio" name="colour" value="white" required />White
             </label>
             <label>
                  <input type="radio" name="colour" value="red" required />Red
              </label>
         </fieldset>
       <label for="size">Size</label>
       <select id="size" name="size" required>
          <option value="">choose a size</option>
          <option value="XS">XS</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
       </select>
       <button type="submit">Order T-shirt</button>
      </form>
    </main>
    <footer>
       <p>By Salah Al-Sabhi</p>
    </footer>
  </body>
</html>
