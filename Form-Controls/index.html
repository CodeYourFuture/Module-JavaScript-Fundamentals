<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <p>Fields marked with <span><strong>*</strong></span> are required.</p>
        <!--create a fieldset with the legend 'customer details'-->
        <fieldset>
          <legend>Customer details:</legend>
           <!--collect customer's name-create two input fields with the labels 'name'and 'surname'-->
          <label for="name">Name:
            <span><strong>*</strong></span>
          </label>
          <input type="text"id="name"name="customer's name"placeholder="Name" pattern="[A-Za-z]" title="letters only" required><br><br>
          <label for="surname">Surname:
            <span><strong>*</strong></span>
          </label>
          <input type="text"id="surname"name="customer's surname"placeholder="Surname" pattern="[A-Za-z]" title="letters only" required><br><br>
          <label for="email">Email:
            <span><strong>*</strong></span>
          </label>
          <input type="email"id="email"name="customer's email"placeholder="Email"  required>
       
        </fieldset>
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <h2>By HOMEWORK SOLUTION</h2>
    </footer>
  </body>
</html>
