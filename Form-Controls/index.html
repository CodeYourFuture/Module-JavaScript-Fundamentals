<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="T-shirt order form" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>

  <body>
    <header>
      <h1>Product Pick</h1>
    </header>

    <main>
      <form action="#" method="post">
        <fieldset>
          <legend>Customer Details</legend>

          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            minlength="2"
            required
            autocomplete="name"
            title="Please enter your name (at least 2 characters)"
          />

          <br /><br />

          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
            title="Please enter a valid email address"
          />
        </fieldset>

        <br />

        <fieldset>
          <legend>T-shirt Colour</legend>

          <label>
            <input type="radio" name="colour" value="black" required />
            Black
          </label>

          <br />
          <br />

          <label>
            <input type="radio" name="colour" value="white" />
            White
          </label>

          <br />
          <br />

          <label>
            <input type="radio" name="colour" value="blue" />
            Blue
          </label>
        </fieldset>

        <br />


        <fieldset>
          <legend>T-shirt Size</legend>

          <label>
            <input type="radio" name="size" value="XS" required />
            XS
          </label>

          <br />
          <br />

          <label>
            <input type="radio" name="size" value="S" />
            S
          </label>

          <br />
          <br />

          <label>
            <input type="radio" name="size" value="M" />
            M
          </label>

          <br />
          <br />

          <label>
            <input type="radio" name="size" value="L" />
            L
          </label>

          <br />
          <br />

          <label>
            <input type="radio" name="size" value="XL" />
            XL
          </label>

          <br />
          <br />

          <label>
            <input type="radio" name="size" value="XXL" />
            XXL
          </label>
        </fieldset>

        <br />

        <button type="submit">Submit order</button>
      </form>
    </main>

    <footer>
      <p>By HOMEWORK SOLUTION</p>
    </footer>
  </body>
</html>
