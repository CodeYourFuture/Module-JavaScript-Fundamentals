<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <div>
        <label for = "name">Name</label>
        <input type = "text" name = "name" id = "name" minlength = "2" required 
        pattern=".*\S.*\S.*" />
        </div>

        
        <div>
        <label for = "email">Email</label>
        <input type = "email" name = "email" id = "email" required/> 
        </div>


        <div>
          <p>Colour</p>
          <input type ="radio" name = "colour" id = "red" value = "Red" required />
          <label for = "red">Red</label>

          <input type = "radio"  name = "colour" id = "blue" value = "Blue"/>
            <label for = "blue">Blue</label>
        
          <input type = "radio" name = "colour" id = "black" value = "Black"/>
           <label for = "black">Black</label>
        </div>

        <div>
          <label for="size">Size</label>

          <select name="size" id="size" required>
            <option value="">Select a size</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
          </select>
        </div>
      <div>
          <button type="submit">Submit</button>
        </div>
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <p>Asanda Dunn</p>
    </footer>
  </body>
</html>
