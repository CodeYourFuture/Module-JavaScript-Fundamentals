<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
       <!-- Name Input -->
       <div>
        <label for="name">Name</label>
        <input type="text" name="name" id="name" minlength="2" required>
       </div>
       
       <!-- Email Input -->
       <div>
        <label for="email">Email</label>
        <input type="email" name="email" id="email" required>
       </div>
       <br>

       <!-- Color select (radio buttons/dropdown) - requires 3 options, 1 pick -->
       <div>
        <label for="colour">Colour</label>
       </div>
       <div>
        <label for="red">Red</label>
        <input type="radio" name="colour" id="red" value="red" required>
        <label for="green">Green</label>
        <input type="radio" name="colour" id="green" value="green">
        <label for="blue">Blue</label>
        <input type="radio" name="colour" id="blue" value="blue">
       </div>

       <!-- Size select (dropdown) - requires 6 options: XS, S, M, L, XL, XXL -->

       <!-- Submit button -->
       <button>Submit</button>
      </form>
    </main>
    <footer>
      <p>By Alex Jamshidi</p>
    </footer>
  </body>
</html>
