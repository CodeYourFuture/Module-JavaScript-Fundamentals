<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>My form exercise</title>
  <meta name="description" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body>
  <header>
    <h1>Product Pick</h1>
  </header>
  <main>
    <form>
      <!-- 
      I have used HTML only.
      I have not used any CSS or JavaScript.
      My form is semantic html.
      All inputs have associated labels.
      My Lighthouse Accessibility score is 100.
      I require a valid name. I have defined a valid name as a text string of two characters or more.
      I require a valid email.
      I require one colour from a defined set of 3 colours.
      I require one size from a defined set of 6 sizes.
      -->

      <h2>Contact details</h2>
      <p>
        <label for="name">Name:</label>
        <input type="text" id="name" name="user_name" minlength="2" required />
      </p>

      <p>
        <label for="email">Email:</label>
        <input type="email" id="email" name="user_email" required />
      </p>

      <h2>T-shirt details</h2>
      <fieldset>
        <legend>Color:</legend>
        <ul>
          <li>
            <label for="color_1">
              <input type="radio" id="color_1" name="color" value="red" />
              Red
            </label>
          </li>

          <li>
            <label for="color_2">
              <input type="radio" id="color_2" name="color" value="white" />
              White
            </label>
          </li>

          <li>
            <label for="color_3">
              <input type="radio" id="color_3" name="color" value="blue" />
              Blue
            </label>
          </li>
        </ul>
      </fieldset>

      <fieldset>
        <legend>Size:</legend>
        <ul>
          <li>
            <label for="size_1">
              <input type="radio" id="size_1" name="size" value="XS" />
              XS
            </label>
          </li>

          <li>
            <label for="size_2">
              <input type="radio" id="size_2" name="size" value="S" />
              S
            </label>
          </li>

          <li>
            <label for="size_3">
              <input type="radio" id="size_3" name="size" value="M" />
              M
            </label>
          </li>

          <li>
            <label for="size_4">
              <input type="radio" id="size_4" name="size" value="L" />
              L
            </label>
          </li>

          <li>
            <label for="size_5">
              <input type="radio" id="size_5" name="size" value="XL" />
              XL
            </label>
          </li>

          <li>
            <label for="size_6">
              <input type="radio" id="size_6" name="size" value="XXL" />
              XXL
            </label>
          </li>
        </ul>
      </fieldset>


    </form>
  </main>
  <footer>
    <!-- change to your name-->
    <h2>By <a href="https://github.com/bytesandroses">bytesandroses</a> for <a href="https://codeyourfuture.io">Code
        Your
        Future</a> </h2>
  </footer>
</body>

</html>
