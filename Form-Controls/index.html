<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>My form exercise</title>
  <meta name="description" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body>
  <header>
    <h1>Product Pick</h1>
  </header>
  <main>
    <form>

      <fieldset>
        <legend>Customer Details</legend>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required autocomplete="name" /><br /><br />
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required autocomplete="email" /><br /><br />
      </fieldset>
      <fieldset>
        <legend>Product Selection</legend>
        <label for="tshirt-color">T-shirt color:</label>
        <select name="tshirtColor" id="tshirt-color" required>
          <option value="" disabled selected>~please select~</option>
          <option value="red">Red</option>
          <option value="blue">Blue</option>
          <option value="green">Green</option>
        </select><br /><br />
        <label for="size">Size:</label>
        <select name="size" id="size" required>
          <option value="" disabled selected>~please select~</option>
          <option value="XS">XS</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
        </select><br /><br />
      </fieldset>
      <button type="submit">Submit</button>
    </form>
  </main>
  <footer>
    <!-- change to your name-->
    <h2>© 2026 Arunkumar Akilan — Form Controls Exercise</h2>
  </footer>
</body>

</html>
