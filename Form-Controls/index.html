<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>T-Shirt Order Form</h1>
    </header>
    <main>
      <form>
        <!-- write your html here-->
        <!-- 
          try writing out the requirements first as comments
        this will also help you fill in your PR message later-->
        <p>
          Required fields are followed by
          <strong><span aria-label="required">*</span></strong>.
        </p>

        <section>
          <p>
            <label for="name">
              <span>Name: </span>
              <strong><span aria-label="required">*</span></strong>
            </label>
            <input type="text" id="name" name="username" required />
          </p>

          <p>
            <label for="mail">
                <span>Email: </span>
                <strong><span aria-label="required">*</span></strong>
            </label>
            <input type="email" id="mail" name="user-mail" required />
          </p>
        </section>

        <section>
          <fieldset>
            <legend>Choose a colour
              <strong><span aria-label="required">*</span></strong>
            </legend>

            <p>
              <label for="red">
                <input type="radio" id="red" name="colour" value="Red" required/>
                  Red
              </label>
            </p>

            <p>
              <label for="blue">
                <input type="radio" id="blue" name="colour" value="Blue" required/>
                  Blue
              </label>
            </p>

            <p>
              <label for="green">
                <input type="radio" id="green" name="colour" value="Green" required/>
                  Green
              </label>
            </p> 
          </fieldset>
        </section>

        <section>
          <fieldset>
            <legend>Choose a size
              <strong><span aria-label="required">*</span></strong>
            </legend>

            <label for="size">Size:</label>
            <select id="size" name="size" required>
              <option value="">--Select a size--</option> <!-- placeholder -->
              <option value="XS">XS</option>
              <option value="S">S</option>
              <option value="M">M</option>
              <option value="L">L</option>
              <option value="XL">XL</option>
              <option value="XXL">XXL</option>
            </select>
          </fieldset>
        </section>

        <!-- Submit Button -->
        <section>
          <p>
            <button type="submit">Submit</button>
          </p>
      </section>
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <h2>By Iswat Bello</h2>
    </footer>
  </body>
</html>
