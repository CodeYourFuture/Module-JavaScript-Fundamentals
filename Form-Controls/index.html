<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" >
    <title>My form exercise</title>
    <meta name="description" content="Find and order T-shirts in different colors and sizes">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>
      <h1>Product Pick</h1>
    <main>
      <form>
        <div>
          <label for="name">Full Name:</label>
        <input id="name" placeholder="Enter your username" type="text" name="name" pattern="[A-Za-z\s]{2,}" required>
        </div>
        <div>
          <label for="email">Email Address:</label>
        <input id="email" placeholder="Enter your email adress" type="email" name="email" required>
        </div>
         <div>
          <label for="color">Choose T-shirt Color:</label>
          <select id="color" name="color" required>
            <option value="" disabled selected hidden>Select a color</option>
            <option value="white">White</option>
            <option value="black">Black</option>
            <option value="brown">Brown</option>
          </select>
          </div>
        <div>
           <label for="size">Choose T-shirt Size</label>
           <select id="size" name="size" required>
            <option value="" disabled selected hidden>Select a size</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
          </select>
          </div>
           <input type="submit" value="submit">
      </form>
    </main>
    <footer>
      <h2>By Fithi Teklom</h2>
    </footer>
  </body>
</html>
