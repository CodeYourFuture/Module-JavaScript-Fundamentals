<form>
  <p>Please complete all required (*) fields.</p>

  <p class="form-field">
    <label for="name">What's your name?*</label>
    <input 
      type="text"
      id="name"
      name="name"
      placeholder="Enter your name"
      required
      minlength="3"
      maxlength="30"
      pattern=".*[A-Za-z].*"
    />
  </p>

  <p class="form-field">
    <label for="email">What's your email address?*</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="Enter your email"
      required
    />
  </p>

  <p class="form-field">
    <label for="color">Pick your color*</label>
    <input
      type="text"
      id="color"
      name="color"
      placeholder="Color"
      list="color-options"
      pattern="Yellow|Blue|White"
      required
    />
    <datalist id="color-options">
      <option>Yellow</option>
      <option>Blue</option>
      <option>White</option>
    </datalist>
  </p>

  <p class="form-field">
    <label for="size">Pick your size*</label>
    <input
      type="text"
      id="size"
      name="size"
      placeholder="Size"
      list="size-options"
      pattern="XS|S|M|L|XL|XXL"
      required
    />
    <datalist id="size-options">
      <option>XS</option>
      <option>S</option>
      <option>M</option>
      <option>L</option>
      <option>XL</option>
      <option>XXL</option>
    </datalist>
  </p>

  <p>
    <button type="submit">Submit</button>
  </p>
</form>
