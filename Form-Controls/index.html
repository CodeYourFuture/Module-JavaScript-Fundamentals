<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <!-- Data required from the user:
         1 - Valid name as a text string of two characters or more. 
         2 - Valid email
         3 - One colour from a defined set of 3 colours.
         4 - One size from a defined set of 6 sizes. XS, S, M, L, XL, XXL
        -->
         <div>
          <label for="username">
            Username: <input type="text" min="2">
          </label>
         </div>
         <div>
          <label for="email">
            Email: <input type="email">
          </label>
         </div>
         <div>
          <label for="colour">
            Red: <input type="radio" name="colour" value="red">
            <br>
            Blue: <input type="radio" name="colour" value="blue">
            <br>
            Yellow: <input type="radio" name="colour" value="yellow">

          </label>
         </div>
         <div>
          <label for="size">
           <select id="size" name="size">
            <option>Choose size</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
           </select>
          </label>
         </div>
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <h2>By Mohammed Abdoon</h2>
    </footer>
  </body>
</html>
