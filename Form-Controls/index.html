<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>

  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
    <form>
        <fieldset>
          <legend><h2> Customer's details:</h2></legend>

          <label for="name"> Name</label>
          <input type="text" name="name" id="name" required pattern=".*\S.*" title="Name cannot be empty or contain only spaces.">
        
      
          <label for="email">Email</label>
          <input type="email" name="email" id="email" required>
        </fieldset>

        <fieldset>
          <legend><h2> Choose a T-Shirt</h2></legend>

          <label for="color">Color</label>
          <select name="color" id="color" required>
            <option value=""> Select </option>
            <option value="red">Red</option>
            <option value="white">White</option>
            <option value="black">Black</option>
          </select>
        
          <p>Size</p>

          <input type="radio" name="size" id="xs" value="xs">
          <label for="xs">XS</label>
          <br>
          <input type="radio" name="size" id="s" value="s">
          <label for="s">S</label>
          <br>
          <input type="radio" name="size" id="m" value="m">
          <label for="m">M</label>
          <br>
          <input type="radio" name="size" id="l" value="l">
          <label for="l">L</label>
          <br>
          <input type="radio" name="size" id="xl" value="xl">
          <label for="xl">XL</label>
          <br>
          <input type="radio" name="size" id="xxl" value="xxl">
          <label for="xxl">XXL</label>
          <br>
        </fieldset>

  <button type="submit"> Submit</button>
  </form>
  </main>

  <footer>
    <p> ping wang </p>
  </footer>
</body>
</html>
