<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>

        <!--Customer Name-->
       <label for="name">Full Name:</label>
        <input type="text" placeholder="Enter your name" id="name" minlength="2" pattern="[A-Za-z ]+"
  title="Name should contain only letters and spaces" required><br><br>

        <!--Customer Email-->
        <label for="email">Email Address:</label>
        <input
        type="email"
        placeholder="Enter your email"
        id="email"
        name="email"
        required>
        <br><br>
       <!--Product Pick-->
       <fieldset>
  <legend>Choose T-shirt Colour</legend>
      <label>
            <input
              type="radio"
              name="colour"
              value="white"
              required> 
              White
            </label>

            <label>
            <input
              type="radio"
              name="colour"
              value="aqua"
              required>
              Aqua
            </label>

            <label>
            <input
              type="radio"
              name="colour"
              value="pink"
              required>
              Pink
            </label>
          </fieldset>
       

<br>
<fieldset>
  <legend>Choose T-Shirt Size</legend>
  <input type="radio" id="xs" name="size" value="xs">
  <label for="xs">XS</label>
  <input type="radio" id="s" name="size" value="S">
  <label for="s">S</label>
  <input type="radio" id="m" name="size" value="M">
  <label for="m">M</label>
  <input type="radio" id="l" name="size" value="L">
<label for="l">L</label>
<input type="radio" id="xl" name="size" value="XL">
<label for="xl">XL</label>
<input type="radio" id="xxl" name="size" value="XXL">
<label for="xxl">XXL</label>

  </fieldset><br><br>
  <button type="submit">Submit</button>

    </form>
    </main>
    <footer>
      <!-- Fattouma Ouannassi-->
      <h2>By Fattouma Ouannassi</h2>
    </footer>
  </body>
</html>
