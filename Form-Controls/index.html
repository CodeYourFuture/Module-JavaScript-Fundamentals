<!-- Customer name (required, at least 2 non-space characters) -->
<!-- Customer email (required, valid email) -->
<!-- T-shirt colour (required, choose 1 of 3 colours) -->
<!-- T-shirt size (required, choose 1 of XS, S, M, L, XL, XXL) -->
<!-- Submit button -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <label for="name">Name</label>
        <input
        type="text"
        id="name"
        name="name"
        required pattern=".*\S.*\S.*"
        />
        <label for="email">Email</label>
        <input
        type="email"
        id="email"
        name="name"
        required
        />
        <fieldset> 
          <legend>Choose T-shirt Colour</legend>
          <input type="radio" id="purple" name="colour" value="purple" required>
          <label for="purple">Purple</label>
          <input type="radio" id="white" name="colour" value="white" required>
          <label for="white">White</label>
          <input type="radio" id="black" name="colour" value="black" required>
          <label for="black">Black</label>
        </fieldset>
        <fieldset> 
          <legend>Choose T-shirt Size</legend>
          <input type="radio" id="xs" name="size" value="xs" required>
          <label for="xs">XS</label>
          <input type="radio" id="s" name="size" value="s">
          <label for="s">S</label>
          <input type="radio" id="m" name="size" value="M">
          <label for="m">M</label>
          <input type="radio" id="l" name="size" value="l">
          <label for="l">L</label>
          <input type="radio" id="xl" name="size" value="xl">
          <label for="xl">XL</label>
          <input type="radio" id="xxl" name="size" value="xxl">
          <label for="xxl">XXL</label>
        </fieldset>
        <button type="submit">Submit</button>
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <p>By HOMEWORK SOLUTION</p>
    </footer>
  </body>
</html>
