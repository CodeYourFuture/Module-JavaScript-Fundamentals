<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <div>
         <label for="name">Name:</label>
         <input type="text" name="name" id="name" placeholder="John Smith" required pattern=".*\s." minlength="2">
        </div>
        <div>
         <label for="email">Email:</label>
         <input type="email" name="email" id="email" placeholder="email" required>
        </div>
        <div>
          Colour - Please select one
        </div>
        <div>
         <label for="red">Red</label>
         <input type=radio name="colour" id="red" value="red" required>
        </div>
        <div>
         <label for="blue">Blue</label>
         <input type=radio name="colour" id="blue" value="blue">
        </div>
        <div>
         <label for="white">White</label>
         <input type=radio name="colour" id="white" value="white">
        </div>
        <div>
          Size - Please select one
        </div>
        <div>
         <label for="xs">XS</label>
         <input type=radio name="size" id="xs" value="xs" required>
        </div>
        <div>
         <label for="s">S</label>
         <input type=radio name="size" id="s" value="s">
        </div>
        <div>
         <label for="m">M</label>
         <input type=radio name="size" id="m" value="m">
        </div><div>
         <label for="l">L</label>
         <input type=radio name="size" id="l" value="l">
        </div><div>
         <label for="xl">XL</label>
         <input type=radio name="size" id="xl" value="xl">
        </div><div>
         <label for="xxl">XXL</label>
         <input type=radio name="size" id="xxl" value="xxl">
        </div>
        <div>
        <button type="submit">SUBMIT</button>
        <button type="reset">RESET</button>
        </div>
        <!-- write your html here-->
        <!-- 
          try writing out the requirements first as comments
        this will also help you fill in your PR message later-->
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <p>By Hugh Mills</p>
    </footer>
  </body>
</html>
