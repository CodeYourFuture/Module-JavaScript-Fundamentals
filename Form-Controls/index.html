<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <!--This update adds a simple HTML form for ordering T-shirts-->
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
       <form>
  <!-- Customer Name -->
  <label for="name">Full Name:</label>
  <input 
    type="text" 
    id="name" 
    name="name" 
    required 
    pattern=^[\p{L}\p{M}' -]+$
    minlength="2" 
    maxlength="50"  
    title="Please enter a valid name (letters, spaces, hyphens, or apostrophes only)"
    required>
  <!-- README does not define a maximum length; using 50 as a sensible default -->
  <br><br>

  <!-- Customer Email -->
  <label for="email">Email Address:</label>
  <input 
    type="email" 
    id="email" 
    name="email" 
    required 
    placeholder="example@email.com">
  <br><br>

  <!-- T-shirt Colour -->
  <label for="colour">Choose T-shirt Colour:</label>
  <select id="colour" name="colour" required>
    <option value="" disabled selected>-- Select a colour --</option>
    <option value="black">Black</option>
    <option value="white">White</option>
    <option value="blue">Blue</option>
  </select>
  <br><br>

  <!-- T-shirt Size -->
  <label for="size">Choose T-shirt Size:</label>
  <select id="size" name="size" required>
    <option value="" disabled selected>-- Select a size --</option>
    <option value="xs">XS</option>
    <option value="s">S</option>
    <option value="m">M</option>
    <option value="l">L</option>
    <option value="xl">XL</option>
    <option value="xxl">XXL</option>
  </select>
  <br><br>

  
  <button type="submit">Submit Order</button>

 
</form>
    </main>
    <footer>
      
      <h2>By Sophia Mohamed</h2>
    </footer>
  </body>
</html>
