<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <!-- try writing out the requirements first as comments
        this will also help you fill in your PR message later-->
        <!-- Customer name: required, at least two non-space characters -->
        <label for="customer-name">Name</label>
        <input
          id="customer-name"
          name="customer-name"
          type="text"
          required
          pattern=".*\S.*\S.*"
          title="Please enter your name, or at least two non-space characters."
        />
        <!-- Customer email: required, valid email format -->
        <label for="customer-email">Email</label>
        <input
          id="customer-email"
          name="customer-email"
          type="email"
          required
        />
        <!-- T-shirt colour: required, 3 choices -->
        <!-- T-shirt size: required, XS, S, M, L, XL, XXL -->
        <!-- Submit button -->
        <button type="submit">Order T-shirt</button>
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <p>By Martim Lou</p>
    </footer>
  </body>
</html>
