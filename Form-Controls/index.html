<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" >
    <meta charset="utf-8" >
    <meta http-equiv="X-UA-Compatible" content="IE=edge" >
    <title>My form exercise</title>
    <meta name="description" content="The page Contains Form to submit customer information about T-shirts" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <!-- -->
        <div>
          <label for="customername">Customer name *: </label>
          <input type="text" id="customername" name="customername" required 
         pattern="^[\p{L}\p{M}\s'-]+$ minlength="2" maxlength="50" 
          placeholder="Customer name"/>
        </div>

        <div>
          <label for="customeremail">Customer email: </label>
          <input type="email" id="customeremail" name="customeremail" required 
          placeholder="Customer email" />
        </div>

        <div>
          <label>T-shirt color *:</label>
          <div class="control">
            <label class="t-color">
            <input type="radio" name="color" value="Black"  required/>
              Black
            </label>
            <label class="t-color">
            <input type="radio" name="color"  value="Red" required/>
            Red 
            </label>
            <label class="t-color">
            <input type="radio" name="color" value="Blue" required/>
              Blue
            </label>
        </div>
      </div>
      <div>
        <label for="sizes">T-shirt size *:</label>
        <select name="sizes" id="sizes" required>
        <option value="" disabled selected>Select size</option>
        <option value="xs">XS</option>
        <option value="s">S</option>
        <option value="m">M</option>
        <option value="l">L</option>
        <option value="xL">XL</option>
        <option value="xxL">XXL</option>
        </select>
      </div>
      <div>  
        <button type="submit" id="submit">Submit</button>
      </div>
    </form>
  </main> 
    <footer>
      <!-- change to your name-->
      <p>By Yonas Gebre</p>
    </footer>
  </body>
</html>
