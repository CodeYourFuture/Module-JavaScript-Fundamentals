<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <!-- 
          - collect customer's name (valid = 2+ characters) -> use minlength="2" and required
             - collect customer's email -> use type="email" and required
             - choose a colour+ use radio buttons
             -choose a size XS S M L XL XXL
             -->
    <main>
      <form>
        <section>
          <legend>Customer details</legend>
          <ul>
            <li>
              <label for="name">
                <span>Name:</span>
                <strong><span aria-label="required"></span></strong>
              </label>
              <input
              type="text"
              id="name"
              name="name"
              required
              minlength="2"
              size="10"
              pattern="^[a-zÀ-ÿ ,.'-]+$" 
              />
            </li>
            <li>
              <label for="email">Enter your email:</label>
              <input type="email" id="email"  size="30" required />
          </li>
        </ul>
        </section>
        <section>
          <legend>T-shirt color & size</legend>
          <ul>
            <li>  <fieldset>
    <legend>T-shirt Color</legend>
    <ul>
      <li>
        <label for="red">
          <input type="radio" id="red" name="color" value="red" />
          Red
        </label>
      </li>
      <li>
        <label for="blue">
          <input type="radio" id="blue" name="color" value="blue" />
          Blue
        </label>
      </li>
      <li>
        <label for="green">
          <input type="radio" id="green" name="color" value="green" />
          Green
        </label>
      </li>
          </ul>
        </fieldset>
      </li>
      <li><fieldset>
    <legend>T-shirt size</legend>
    <ul>
      <li>
        <label for="XS">
          <input type="radio" id="XS" name="size" value="XS" />
          XS
        </label>
      </li>
      <li>
        <label for="S">
          <input type="radio" id="S" name="size" value="S" />
          S
        </label>
      </li>
      <li>
        <label for="M">
          <input type="radio" id="M" name="size" value="M" />
          M
        </label>
      </li>
      <li><label for="L">
          <input type="radio" id="L" name="size" value="L" />
          L
        </label></li>
        <li><label for="XL">
          <input type="radio" id="XL" name="size" value="XL" />
          XL
        </label></li>
        <li><label for="XXL">
          <input type="radio" id="XXL" name="size" value="XXL" />
          XXL
        </label></li>
    </ul>
  </fieldset></li>
  </ul>
        </section>
        <button type="submit">Submit</button>
        
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <h2>By HOMEWORK SOLUTION</h2>
    </footer>
  </body>
</html>
