<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>My form exercise</title>
  <meta name="description" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body>
  <header>
    <h1>Product Pick</h1>
  </header>
  <main>
    <form>
      <div>
        <label for="name">Customer Name: </label>
        <input type="text" name="name" id="name" placeholder="enter your name" required minlength="2"
          pattern=".*\S.*\S.*">
      </div><br />
      <div>
        <label for="email">Customer Email: </label>
        <input type="email" name="email" id="email" placeholder="you@example.com" required>
      </div>
      <div>
        <p>Choose a T‑shirt colour:</p>

        <label>
          <input type="radio" name="colour" value="red" required>
          Red
        </label>

        <label>
          <input type="radio" name="colour" value="blue">
          Blue
        </label>

        <label>
          <input type="radio" name="colour" value="black">
          Black
        </label>
      </div>
      <div>
        <p>Choose a T‑shirt size:</p>

        <select name="size" required>
          <option value="">-- Select a size --</option>
          <option value="XS">XS</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
        </select>
      </div> <br />
      <button type="submit">Submit</button>

    </form>
  </main>
  <footer>
    <p>By LAVANYA</p>
  </footer>
</body>

</html>
