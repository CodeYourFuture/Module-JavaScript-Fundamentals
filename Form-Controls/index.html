<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <fieldset>
          <p>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" minlength="2" autocomplete="name" required />
          </p>
          <p>
            <label for="email">E-Mail:</label>
            <input type="email" id="email" name="email" autocomplete="email" required />
          </p>
          <p>
            T-shirt colour:
            <ul>
              <li><input type="radio" id="tshirtcolour1" name="tshirtcolour" value="blue" required /> <label for="tshirtcolour1">Blue</label></li>
              <li><input type="radio" id="tshirtcolour2" name="tshirtcolour" value="red" required /> <label for="tshirtcolour2">Red</label></li>
              <li><input type="radio" id="tshirtcolour3" name="tshirtcolour" value="white" required /> <label for="tshirtcolour3">White</label></li>
            </ul>
          </p>
          <p>
            T-shirt size:
            <ul>
              <li><input type="radio" id="tshirtsize1" name="tshirtsize" value="xs" required /> <label for="tshirtsize1">XS</label></li>
              <li><input type="radio" id="tshirtsize2" name="tshirtsize" value="s" required /> <label for="tshirtsize2">S</label></li>
              <li><input type="radio" id="tshirtsize3" name="tshirtsize" value="m" required /> <label for="tshirtsize3">M</label></li>
              <li><input type="radio" id="tshirtsize4" name="tshirtsize" value="l" required /> <label for="tshirtsize4">L</label></li>
              <li><input type="radio" id="tshirtsize5" name="tshirtsize" value="xl" required /> <label for="tshirtsize5">XL</label></li>
              <li><input type="radio" id="tshirtsize6" name="tshirtsize" value="xxl" required /> <label for="tshirtsize6">XXL</label></li>
            </ul>
          </p>
          <p>
            <button type="submit">Confirm Order</button>
          </p>
        </fieldset>
        <!-- write your html here-->
        <!-- 
          try writing out the requirements first as comments
        this will also help you fill in your PR message later-->
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <h2>By HOMEWORK SOLUTION</h2>
    </footer>
  </body>
</html>
