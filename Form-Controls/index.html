<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="description" content="" />
		<title>My form exercise</title>
		<meta name="description" content="" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
	</head>
	<body>
		<header>
			<h1>T-shirt Picker</h1>
		</header>
		<main>
			<form>
				<p>Customer Info</p>
				<!-- name input, must be min 2 chars long -->
				<p>
					<label for="name"> Name</label>
					<input
						type="text"
						id="name"
						name="customerName"
						placeholder="Jane Smith"
					/>
				</p>
				<!-- email input, must be a valid email format -->
				<p>
					<label for="email"> Email</label>
					<input
						type="email"
						id="email"
						name="customerEmail"
						placeholder="jsmith@email.com"
					/>
				</p>

				<p>Colours</p>
				<!-- colours input, limit to 3 colours only -->
				<p>Please select a colour</p>
				<ul>
					<li>
						<p>
							<input type="radio" name="colours" id="red" />
							<label for="red"> &#x1F7E5; Red </label>
						</p>
					</li>
					<li>
						<p>
							<input type="radio" name="colours" id="blue" />
							<label for="blue">&#x1F7E6; Blue </label>
						</p>
					</li>
					<li>
						<p>
							<input type="radio" name="colours" id="yellow" />
							<label for="yellow">&#x1F7E8; Yellow </label>
						</p>
					</li>
				</ul>
				<!-- size input, limit to 6 sizes: XS, S, M, L, XL, XXL -->
				<p>Size</p>
				<p>
					<label for="size">Please select a size</label>
					<select name="" id="size">
						<option value="XS">XS</option>
						<option value="S">S</option>
						<option value="M">M</option>
						<option value="L">L</option>
						<option value="XL">XL</option>
						<option value="XXL">XXL</option>
					</select>
				</p>

				<!-- submit button -->
				<button type="submit">Confirm your order</button>
			</form>
		</main>
		<footer>
			<!-- change to your name-->
			<h2>Kris Oldrini | CYF: Intro to Programming</h2>
		</footer>
	</body>
</html>
