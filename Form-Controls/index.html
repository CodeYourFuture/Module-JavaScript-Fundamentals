<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>

    <header>
      <h1>Product Pick</h1>
    </header>

    <main>
      <form>
        <label for="name"> Name: </label>
        <input type="text" id="name" name="Name" minlength="2" required>
       
        <br> <br>
        <label for="email"> Email: </label>
        <input type="email" id="email" name="email" required>

        <br> <br>
        <label for="colour"> T-shirt colour:</label>
        <select id="colour" name="T-shirt colour"> 
          <option value="Red"> Red</option>
          <option value="Blue"> Blue</option>
          <option value="Green"> Green</option>

        </select>

       <br>
        <P> Size:
        
        <br> <br>
        <label for="XS"> XS</label>
        <input type="radio" id="XS" name="Size">
        
        <br> <br>
        <label for="S"> S</label>
        <input type="radio" id="S" name="Size">

        <br> <br>
        <label for="M"> M</label>
        <input type="radio" id="M" name="Size">

        <br> <br>
        <label for="L"> L</label>
        <input type="radio" id="L" name="Size">

        <br> <br>
        <label for="XL"> XL</label>
        <input type="radio" id="XL" name="Size">

        <br> <br>
        <label for="XXL"> XXL</label>
        <input type="radio" id="XXL" name="Size">

        </P>

      
      </form>
    </main>

    <footer>
    
      <h2>Ahmed Elmahmoudi</h2>
    </footer>
  </body>
</html>
