<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>My Form Exercise</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body>
  <header>
    <h1>Product Pick</h1>
  </header>

  <main>
    <form>
      <fieldset>
        <legend>Personal Information</legend>

        <label>
          Name
          <input type="text" name="name" pattern="^[A-Za-z]{2,20}$" required />
        </label>

        <br /><br />

        <label>
          Email
          <input type="email" name="email" required />
        </label>
      </fieldset>

      <fieldset>
        <legend>Product Information</legend>

        <p>Select a colour:</p>

        <label>
          Red
          <input type="radio" name="colour" value="red" required />
        </label>

        <label>
          Blue
          <input type="radio" name="colour" value="blue" />
        </label>

        <label>
          Green
          <input type="radio" name="colour" value="green" />
        </label>

        <p>Choose your size:</p>

        <label>
          XS
          <input type="radio" name="size" value="extra-small" required />
        </label>

        <label>
          S
          <input type="radio" name="size" value="small" />
        </label>

        <label>
          M
          <input type="radio" name="size" value="medium" />
        </label>

        <label>
          L
          <input type="radio" name="size" value="large" />
        </label>

        <label>
          XL
          <input type="radio" name="size" value="extra-large" />
        </label>

        <label>
          XXL
          <input type="radio" name="size" value="double-extra-large" />
        </label>
      </fieldset>

      <br />
      <input type="submit" value="Submit" />
    </form>
  </main>

  <footer>
    <h2>By Francis Dore Etonkie</h2>
  </footer>
</body>
</html>
