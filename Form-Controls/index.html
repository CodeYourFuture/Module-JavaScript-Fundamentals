<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>My form exercise</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        
        <label for="cname">Customer name</label>
        <input type="text" id="cname" name="cname" title="Please enter at least 2 non-space characters." pattern=".*\S.*\S.*" required>

        <label for="cemail">Customer email</label>
        <input type="email" id="cemail" name="cemail" required>

        <label for="tcolor">T-shirt color</label>
        <select id="tcolor" name="tcolor" required>
          <option value="">Choose a color</option>
          <option value="White">White</option>
          <option value="Black">Black</option>
          <option value="Blue">Blue</option>
        </select>

        <label for="tsize">T-shirt size</label>
        <select id="tsize" name="tsize" required>
          <option value="">Choose a size</option>
          <option value="XS">XS</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
        </select>

        <input type="submit" value="Place order">

      </form>
    </main>
    <footer>
      <p>By Tyler-leigh Ross</p>
    </footer>
  </body>
</html>
