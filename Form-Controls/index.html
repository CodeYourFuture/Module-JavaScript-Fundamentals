<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="Form for ordering T-Shirts" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      form div {
        margin-bottom: 10px;
      }
      #name,
      #email,
      #colour {
        padding: 10px;
        font-size: 1rem;
        border: 1px solid black;
        border-radius: 5px;
      }

      input[type="text"],
      input[type="email"],
      select {
        width: 100%;
        max-width: 400px;
        padding: 20px;
        box-sizing: border-box;
      }

      button {
        background-color: blue;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-size: 1.5rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Product Pick - T-Shirt Order Form</h1>
    </header>
    <main>
      <form>
       
        <div>
          <label for="name">Full Name</label>
          <input
            id="name"
            name="name"
            type="text"
            required
            pattern=".*\S.*\S.*"
          />
        </div>

        <div>
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" required />
        </div>
       
        <fieldset>
          <legend>Choose your Colour</legend>

          <label for="colour" class="visually-hidden">Colour Choice</label>
          <select id="colour" name="colour" required>
            <option value="">Select Your Colour</option>
            <option value="Burgundy">Burgundy</option>
            <option value="Purple">Purple</option>
            <option value="Yellow">Yellow</option>
          </select>
        </fieldset>

        <fieldset>
          <legend>Size Choice</legend>
          <div>
            <label>
              <input type="radio" name="size" value="XS" required />
              XS
            </label>

            <label>
              <input type="radio" name="size" value="S" />
              S
            </label>

            <label>
              <input type="radio" name="size" value="M" />
              M
            </label>
            <label>
              <input type="radio" name="size" value="L" />
              L
            </label>
            <label>
              <input type="radio" name="size" value="XL" />
              XL
            </label>
            <label>
              <input type="radio" name="size" value="XXL" />
              XXL
            </label>
          </div>
        </fieldset>
        

        <button type="submit">Place Your Order</button>
      </form>
    </main>
    <footer>
      
      <p>By CHINWE CHUKWUMA</p>
    </footer>
  </body>
</html>
