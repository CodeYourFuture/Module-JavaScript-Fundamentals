<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <div>
        <label for="name">Name</label>
        <br>
        <input type="text" name="name" id="name" minlength="2" required>
        </div>
        <div>
        <label for="email">Email</label>
        <br>
        <input type="email" name="email" id="email" required>
        </div>
        <div>
        <label for="Tshirtcolour">Tshirt colour</label>
        <br>
        <select name="Tshirtcolour" id="Tshirtcolour" required>
        <option value="" disabled selected> Select a colour</option>
        <option value="Red">Red</option>
        <option value="Blue">Blue</option>
        <option value="Yellow">Yellow</option>
        </select>
        </div>
        <div>
        <label for="Tshirtsize">Tshirt size</label>
        <br>
        <select name="Tshirtsize" id="Tshirtsize" required>
        <option value="" disabled selected> Select a size</option>
        <option value="XS">XS</option>
        <option value="S">S</option>
        <option value="M">M</option>
        <option value="L">L</option>
        <option value="XL">XL</option>
        <option value="XXL">XXL</option> 
        </select>
        </div>  
        <br>
        <button type="reset">Reset</button>
        <br>
        <br>
        <input type="submit" value="Submit"></form>
        </main>
        <footer>
      <h2>By PRAKASH DCOSTA</h2>
    </footer>
  </body>
</html>
