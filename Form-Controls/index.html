<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>My form exercise</title>
  <meta name="description" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body>
  <header>
    <h1>Product Pick</h1>
  </header>
  <main>
    <form>

      <h2>Contact details</h2>
      <p>
        <label for="name">Name:</label>
        <input type="text" id="name" name="user_name" minlength="2" required />
      </p>

      <p>
        <label for="email">Email:</label>
        <input type="email" id="email" name="user_email" required />
      </p>

      <h2>T-shirt details</h2>
      <fieldset>
        <legend>Color:</legend>
        <p>
          <label for="color_1">
            <input type="radio" id="color_1" name="color" value="red" required />
            Red
          </label>
        </p>

        <p>
          <label for="color_2">
            <input type="radio" id="color_2" name="color" value="white" required />
            White
          </label>
        </p>

        <p>
          <label for="color_3">
            <input type="radio" id="color_3" name="color" value="blue" required />
            Blue
          </label>
        </p>
      </fieldset>

      <p></p>

      <fieldset>
        <legend>Size:</legend>

        <p>
          <label for="size_1">
            <input type="radio" id="size_1" name="size" value="XS" required />
            XS
          </label>
        </p>

        <p>
          <label for="size_2">
            <input type="radio" id="size_2" name="size" value="S" required />
            S
          </label>
        </p>

        <p>
          <label for="size_3">
            <input type="radio" id="size_3" name="size" value="M" required />
            M
          </label>
        </p>

        <p>
          <label for="size_4">
            <input type="radio" id="size_4" name="size" value="L" required />
            L
          </label>
        </p>

        <p>
          <label for="size_5">
            <input type="radio" id="size_5" name="size" value="XL" required />
            XL
          </label>
        </p>

        <p>
          <label for="size_6">
            <input type="radio" id="size_6" name="size" value="XXL" required />
            XXL
          </label>
        </p>

      </fieldset>
      <p></p>
      <button type="submit">Submit</button>
    </form>
  </main>
  <footer>
    <h2>By <a href="https://github.com/bytesandroses">bytesandroses</a> for <a href="https://codeyourfuture.io">Code
        Your
        Future</a> </h2>
  </footer>
</body>

</html>
