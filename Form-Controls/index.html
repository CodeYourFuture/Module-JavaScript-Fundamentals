<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <!-- Requirements:
       - Collect customer name (minimum 2 characters)
       - Collect customer email (must be valid email)
       - Choose 1 colour from 3 options
       - Choose 1 size from 6 options (XS, S, M, L, XL, XXL)
       - All fields are required
       - HTML only, no CSS or JavaScript
       - No form action
       -->
       <p>
       <label for="customer-name">Name</label><br />
       <input
       type="text"
       id="customer-name"
       name="customerName"
       required
       minlength="2"
       />
       </p>
       <p>
       <label for="customer-email">Email</label><br />
       <input
       type="email"
       id="customer-email"
       name="customerEmail"
       required
       />
       </p>
       <fieldset>
       <legend>Choose a colour</legend>

       <p>
       <input
       type="radio"
       id="colour-red"
       name="tshirtColour"
       value="red"
       required
       />
       <label for="colour-red">Red</label>
       </p>

       <p>
       <input
       type="radio"
       id="colour-blue"
       name="tshirtColour"
       value="blue"
       />
       <label for="colour-blue">Blue</label>
       </p>

       <p>
       <input
       type="radio"
       id="colour-green"
       name="tshirtColour"
       value="green"
       />
       <label for="colour-green">Green</label>
       </p>
       </fieldset>
       
       </form>
       </main>
       <footer>
      <!-- change to your name-->
      <h2>By Laura</h2>
    </footer>
  </body>
</html>
