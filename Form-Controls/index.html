<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form-controls exercise</title>
    <meta name="description" content="Form to buy a t-shirt" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
      <p><em>Welcome back to your favourite T-Shirt shop. <br>Please provide your name, email, colour and <br>size to pick your product Thank you.</em></p>
    </header>
    <br>
    <hr>
    <br>
    <main>
      <form>
        <div>
          <label for="customername">Customer name:</label>
          <input
            type="text"
            id="customername"
            name="customername"
            placeholder="your name"
            required
            minlength="2"
            pattern="[A-Za-z]{2,}"
            title="Please enter at least two letters for your name"
          />
        </div>
        <br />
        <div>
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="customer_email"
            placeholder="your email"
            required
          />
        </div>
        <br />
        <div>
          <fieldset>
            <legend>T-shirt Colour</legend>
            <p>
              <input type="radio" name="color" id="color_1" value="red" />
              <label for="color_1">Red</label>
            </p>
            <p>
              <input type="radio" name="color" id="color_2" value="blue" />
              <label for="color_2">Blue</label>
            </p>
            <p>
              <input type="radio" name="color" id="color_3" value="green" />
              <label for="color_3">Green</label>
            </p>
          </fieldset>
        </div>
        <br />
        <div>
          <fieldset>
            <legend>T-shirt Size</legend>
            <p>
              <input type="radio" name="size" id="size_1" value="xs" />
              <label for="size_1">Extra small (XS)</label>
            </p>
            <p>
              <input type="radio" name="size" id="size_2" value="s" />
              <label for="size_2">Small (S)</label>
            </p>
            <p>
              <input type="radio" name="size" id="size_3" value="m" />
              <label for="size_3">Medium (M)</label>
            </p>
            <p>
              <input type="radio" name="size" id="size_4" value="l" />
              <label for="size_4">Large (L)</label>
            </p>
            <p>
              <input type="radio" name="size" id="size_5" value="xl" />
              <label for="size_5">Extra Large (XL)</label>
            </p>
            <p>
              <input type="radio" name="size" id="size_6" value="xxl" />
              <label for="size_6">Extra Extra Large (XXL)</label>
            </p>
          </fieldset>
        </div>
        <br />
        <p class="button">
          <button type="submit">Submit Details</button>
        </p>
      </form>
    </main>
    <footer>
      <h2>By Baba Yusuf</h2>
    </footer>
  </body>
</html>
