<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form method="get">
        <label for="fname">First Name:</label>
        <input
          id="fname"
          name="fname"
          type="text"
          required
          minlength="2"
        /><br />
        <hr />
        <label for="lname">Last Name:</label>
        <input id="lname" name="lname" type="text" required /><br />
        <hr />
        <label for="email">Email:</label>
        <input id="email" name="email" type="email" required /><br />
        <hr />
        <label for="tshirt-col">Choose a t-shirt color:</label>
        <select name="tshirt" id="tshirt-col" required>
          <option value="">--Please choose an option--</option>
          <option value="red">Red</option>
          <option value="blue">Blue</option>
          <option value="green">Green</option></select
        ><br />
        <hr />
        <label for="tshirt-size">Choose a t-shirt size:</label>
        <select name="size" id="tshirt-size" required>
          <option value="">--Please choose an option--</option>
          <option value="xs">XS</option>
          <option value="s">S</option>
          <option value="m">M</option>
          <option value="l">L</option>
          <option value="xl">XL</option>
          <option value="xxl">XXL</option>
        </select>
      </br>
        <input type="submit" />
      </form>
    </main>
    <footer>
      <h2>By Jak R-S</h2>
    </footer>
  </body>
</html>
