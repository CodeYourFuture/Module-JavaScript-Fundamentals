<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
  <form>
    <label for="name">Name:</label>
<input type="text" id="name" name="name" required pattern=".*\S.*\S.*">
<label for="email">Email:</label>
<input type="email" id="email" name="email" required>
<fieldset>
  <legend>Colour:</legend>
  <input type="radio" id="red" name="colour" value="red" required>
  <label for="red">Red</label>

  <input type="radio" id="blue" name="colour" value="blue">
  <label for="blue">Blue</label>

  <input type="radio" id="black" name="colour" value="black">
  <label for="black">Black</label>
</fieldset>
  </form>
    </main>
    <footer>
      <!-- change to your name-->
      <p>By HOMEWORK SOLUTION</p>
    </footer>
  </body>
</html>
