<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form control</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="description" content="F" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <fieldset>
          <legend>Personal Information</legend>
          <label for="name">Name:</label>
          <input
            type="text"
            id="name"
            name="name"
            autocomplete="name"
            pattern="^\s*(\S\s*){2,}$"
            required
            title="Please enter at least 2 characters"
          />
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          />
        </fieldset>

        <fieldset>
          <legend>Please select your color</legend>

          <input type="radio" id="black" name="color" value="Black" required />
          <label for="black">Black</label>

          <input type="radio" id="beige" name="color" value="Beige" />
          <label for="beige">Beige</label>

          <input type="radio" id="red" name="color" value="Red" />

          <label for="red">Red</label>
        </fieldset>

        <fieldset>
          <legend>Please select a size</legend>

          <label for="size">Choose a size:</label>
          <select name="size" id="size" required>
            <option value="" disabled selected>
              -- Please choose an option --
            </option>
            <option value="extra-small">Extra Small</option>
            <option value="small">Small</option>
            <option value="medium">Medium</option>
            <option value="large">Large</option>
            <option value="extra-large">Extra Large</option>
            <option value="double-extra-large">Extra Extra Large</option>
          </select>
        </fieldset>

        <input type="submit" value="Submit" />
      </form>
    </main>
    <footer>Product Pick Form</footer>
  </body>
</html>
