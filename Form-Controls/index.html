<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <!-- write your html here-->
        <fieldset>
          <legend>Order your T-shirt</legend>
          <legend>Your name  registered with us</legend>
          <div id="name-field">
            <!-- customer valid name-->
            <label for="name">Name:</label>
            <input 
              type="text" 
              id="name" 
              name="name" 
              minlength="2" 
              pattern="^[A-Za-z]{2,}$" 
              placeholder="enter your name"
              required 
            />
          </div>
          <legend>Your email registered with us</legend>
          <div id="email-field">
            <!-- customer valid email-->
            <label for="email">Email:</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              pattern="^[A-Za-z0-9._]+@[A-Za-z0-9]+\.[a-z]{2,}(\.[a-z]{2,})?$"
              placeholder="enter your email"
              required 
            />
          </div>
          <legend>Please choose the color of T-shirt you like</legend>
          <div id="tshirt-color">
            <!-- color of the T-shirt-->
            <label for="color">T-shirt Color:</label>
            <select id="color" name="color" required>
              <option value="" disabled selected>Select a color</option>
              <option value="blue">Blue</option>
              <option value="black">Black</option>
              <option value="white">White</option>
            </select>
          </div>
          <legend>Please choose the size of T-shirt you like</legend>
          <div id="tshirt-size">
            <!-- size of the T-shirt-->   
            <label for="size">T-shirt Size:</label>
            <select id="size" name="size" required>
              <option value="" disabled selected>Select a size</option>
              <option value="XS">XS</option>
              <option value="S">S</option>
              <option value="M">M</option>
              <option value="L">L</option>
              <option value="XL">XL</option>
              <option value="XXL">XXL</option>
            </select>
          </div>     
        </fieldset>
        <!-- try writing out the requirements first as comments
        this will also help you fill in your PR message later-->
        <button id="submit-button" type="submit">Submit order</button>
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <h2>By Tze Ming Ho</h2>
    </footer>
  </body>
</html>
