<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Ordering T-Shirt Form</title>
  <meta name="description" content="T-shirt Ordering Form">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
  <header>
    <h1>T-shirt Ordering Form</h1>
    <p>Required fields are followed by *</p>
  </header>
  <main>
    <form>
      <fieldset>
        <legend><strong>Information</strong></legend>
        <div>
          <label for="name"> Name: <span aria-label="required">*</span></label>
          <input type="text" name="name" id="name" placeholder="enter your name" required minlength="2"
            maxlength="20"><br><br>
        </div>
        <div>
          <label for="e-mail">e-mail: <span aria-label="required">*</span></label>
          <input id="e-mail" type="email" name="e-mail" placeholder="enter your email" required>
        </div>
        <br>
      </fieldset> <br>
      <fieldset>
          <legend><strong>T-Shirt's Colour</strong></legend>
            <p>What colour should the t-shirt be? <span aria-label="required">*</span> required</p>
        <div>
          <label for="red"> Red </label>
          <input type="radio" name="color" id="red" value="red">
        </div>
        <br>
        <div>
          <label for="yellow"> Yellow </label>
          <input type="radio" name="color" id="yellow" value="yellow">
        </div>
        <br>
        <div>
          <label for="black"> Black </label>
          <input type="radio" name="color" id="black" value="black">
        </div>
      </fieldset> <br>
      <fieldset>
          <legend><strong>T-Shirt's Size</strong></legend>
          <p>What size should the t-shirt be? <span aria-label="required">*</span></p>
        <div>
          <label for="size"> size: </label>
          <select id="size" name="size" required >
            <option value="" disabled selected>-</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
          </select>
        </div>
      </fieldset><br>
      <button type="reset" aria-label="Reset the form">Reset</button>
      <button type="submit" aria-label="Submit the form">Submit</button>
    </form>
  </main>
  <footer>
    <h2><em>By Shohreh Bayat for Code Your Future</em></h2>
  </footer>
</body>

</html>
