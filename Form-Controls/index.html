<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>

      <form>

        <fieldset>
          <legend>Your Details</legend>
            <p>
              <label for="name">Name:</label>
              <input type="text" name="name" id="name" placeholder="John Smith" required>
            </p>

            <p>
              <label for="email">Email:</label>
              <input type="text" name="email" id="email" placeholder="example@email.com" required>
            </p>
        </fieldset>

        <fieldset>
          <legend>Shirt Colour Options</legend>
            <p>
              <input type="radio" name="color" id="colour_1">
              <label for="red">Red</label>
            </p>
            <p>
              <input type="radio" name="color" id="colour_2">
              <label for="blue">Blue</label>
            </p>
            <p>
              <input type="radio" name="color" id="colour_3">
              <label for="green">Green</label>
            </p>
        </fieldset>

        <fieldset>
          <legend>Shirt Size Options</legend>
            <label for="size">Size Options</label>
              <select name="size" id="shirt-size">
                <option value="xs">Extra Small</option>
                <option value="s">Small</option>
                <option value="m">Medium</option>
                <option value="l">Large</option>
                <option value="xl">Extra Large</option>
                <option value="xll">Extra Extra Large</option>
              </select>
        </fieldset>
<!--
Writing that out as a series of questions to ask yourself:

1. What is the customer's name? I must collect this data and ensure it contains at least two non-space characters.
2. What is the customer's email? I must make sure the email is valid. Email addresses follow a consistent pattern.
3. What colour should this T-shirt be? I must provide 3 options. How will I ensure they do not choose other colours?
4. What size does the customer want? I must provide the following 6 options: XS, S, M, L, XL, XXL
-->
      </form>
    </main>
    <footer>
      <p>By MATTHAUS BAUSE</p>
    </footer>
  </body>
</html>
