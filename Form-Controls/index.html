<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <!-- 
          - collect customer's name (valid = 2+ characters) -> use minlength="2" and required
             - collect customer's email -> use type="email" and required
             - choose a colour+ use radio buttons
             -choose a size XS S M L XL XXL
             -->
    <main>
      <form aria-labelledby="formTitle">
        <section>
          <fieldset>
            <legend id="formTitle">Customer details</legend>
          
              <label for="name">   
                Name <strong><span>*</span></strong>
              </label>
              <br />
              <input
              type="text"
              id="name"
              name="name"
              required
              minlength="2"
              size="10"
              pattern="^[a-zÀ-ÿ ,.'-]+$" 
              />
              <br />
              <br />
              <label for="email">Enter your email:
              </label>
              <br />
              <input 
              type="email" 
              id="email"  
              size="30" 
              required />
              <br />
              <br />
          </fieldset>
        </section>
        <section>
        <fieldset>
          <legend>T-shirt color</legend>
        
        <label for="red">
          <input type="radio" id="red" name="color" value="red" />
          Red
        </label>
      
        <label for="blue">
          <input type="radio" id="blue" name="color" value="blue" />
          Blue
        </label>
    
        <label for="green">
          <input type="radio" id="green" name="color" value="green" />
          Green
        </label>
    </fieldset>
   <fieldset>

    <legend>T-shirt size</legend>
    
        <label for="XS">
          <input type="radio" id="XS" name="size" value="XS" />
          XS
        </label>
        
        <label for="S">
          <input type="radio" id="S" name="size" value="S" />
          S
        </label>
        
        <label for="M">
          <input type="radio" id="M" name="size" value="M" />
          M
        </label>
        <label for="L">
          <input type="radio" id="L" name="size" value="L" />
          L
        </label>
        <label for="XL">
          <input type="radio" id="XL" name="size" value="XL" />
          XL
        </label>
      
        <label for="XXL">
          <input type="radio" id="XXL" name="size" value="XXL" />
          XXL
        </label>
      
      </fieldset>
        </section>
        <button type="submit">Submit</button>
        
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <h2>By HOMEWORK SOLUTION</h2>
    </footer>
  </body>
</html>
