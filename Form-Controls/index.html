<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="Hadi tshirt online sale" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
   <form>
        <div>
          <label for="name">Name:</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
            minlength="2"
          />
        </div>

        <div>
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
            required
          />
        </div>

        <br />

        <div>
          <label for="colour">Choose a colour:</label>
          <select id="colour" name="colour" required>
            <option value="">-- Please choose --</option>
            <option value="red">Red</option>
            <option value="blue">Blue</option>
            <option value="green">Green</option>
          </select>
        </div>

        <br />

        <fieldset>
          <legend>Please choose the size:</legend>

          <input type="radio" id="extraSmall" name="size" value="xs" required />
          <label for="extraSmall">XS</label>

          <input type="radio" id="small" name="size" value="small" />
          <label for="small">S</label>

          <input type="radio" id="medium" name="size" value="medium" />
          <label for="medium">M</label>

          <input type="radio" id="large" name="size" value="large" />
          <label for="large">L</label>

          <input type="radio" id="extraLarge" name="size" value="xl" />
          <label for="extraLarge">XL</label>

          <input type="radio" id="xxl" name="size" value="xxl" />
          <label for="xxl">XXL</label>
        </fieldset>

        <br />

        <button type="submit">Submit</button>
      </form>
        <!-- write your html here-->
        <!-- 
          try writing out the requirements first as comments
        this will also help you fill in your PR message later-->

    </main>
    <footer>
      <!-- change to your name-->
      <p>By Hadi Vahidi</p>
    </footer>
  </body>
</html>
