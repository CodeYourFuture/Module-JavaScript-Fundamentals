     <form>
        <fieldset>
          <legend>Customer Information</legend>
          <p>
            <label for="customerName">Customer Name</label>
            <input
              id="customerName"
              name="customerName"
              type="text"
              pattern=".*\S.*\S.*"
              placeholder="username"
              required
            />
          </p>
          <p>
            <label for="emailAddress">Email Address</label>
            <input
              id="emailAddress"
              name="emailAddress"
              type="email"
              placeholder="email"
              required
            />
          </p>
        </fieldset>
