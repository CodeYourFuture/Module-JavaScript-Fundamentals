<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <!-- Customer name -->
        <label for="name">Full Name:</label>
        <input id="name" type="text" name="name" pattern="[A-Za-z\s]{2,}" required />

        <!-- Customer email -->
        <label for="email">Email Address:</label>
        <input id="email" type="email" name="email" required />

        <!-- T-shirt color -->
         <label for="color">Choose T-shirt Color:</label>
          <select id="color" name="color" required>
            <option for="white">White</option>
            <option for="black">Black</option>
            <option for="brown">Brown</option>
          </select>

        <!-- T-shirt size--> 
         <label for="size">Choose T-shirt Size</label>
          <selct id="size" name="size" required>
            <option>--Select a size--</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XLL">XLL</option>
          </selct>

          <!-- Submit button -->
           <input type="submit" value="submit"
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <h2>By Fithi Teklom</h2>
    </footer>
  </body>
</html>
