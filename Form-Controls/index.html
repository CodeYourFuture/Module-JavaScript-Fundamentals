<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <!--
        Requirements:
        1) Customer name: contain at least 2 non-space chars
        2) Customer email: valid email, follow consistent pattern
        3) Color of T-shirt: dd-list of options/ select
        4) Size of T-shirt: 6 options(XS, S, M, L, XL, XXL)
        5) HTML AND CSS ONLY
        6) Commit after each step
        -->
        
        <label for="cname">Customer name</label>
        <input type="text" id="cname" name="cname" title="Please enter at least 2 non-space characters." pattern=".*\S.*\S.*">

        <label for="cemail">Customer email</label>
        <input type="email" id="cemail" name="cemail" required>

        <label for="tcolor">T-shirt color</label>
        <select id="tcolor" name="tcolor" required>
        <option value="White">White</option>
        <option value="Black">Black</option>
        <option value="Blue">Blue</option>
        </select>

        <label for="tsize">T-shirt size</label>
        <select id="tsize" name="tsize" required>
        <option value="XS">XS</option>
        <option value="S">S</option>
        <option value="M">M</option>
        <option value="L">L</option>
        <option value="XL">XL</option>
        <option value="XXL">XXL</option>
        </select>

        <input type="submit" value="Submit Form">
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <p>By Tyler-leigh Ross</p>
    </footer>
  </body>
</html>
