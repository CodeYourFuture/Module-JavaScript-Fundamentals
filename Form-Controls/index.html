<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <!-- Data required from the user:
         1 - Valid name as a text string of two characters or more. 
         2 - Valid email
         3 - One colour from a defined set of 3 colours.
         4 - One size from a defined set of 6 sizes. XS, S, M, L, XL, XXL
        -->
         <div>
          <h2>Personal Details:</h2>
          <div>
          
          <label for="username">
            <h3>Username: <input type="text" min="2"></h3>
          </label>
          </div>
          <div>
          <label for="email">
            <h3>Email: <input type="email"></h3>
          </label>
          </div>
         </div>
         <div>
          <h2>Prodect Specification:</h2>
          <div>
            <h3>Choose Color:</h3>
            <label for="colour">
              <h4>
              Purple: <input type="radio" name="colour" value="red">
              <br>
              Green :  <input type="radio" name="colour" value="blue">
              <br>
              Yellow: <input type="radio" name="colour" value="yellow">
              </h4>
            </label>
          </div>
          <div>
            <label for="size">
              <h4>
                  Select Size:
                  <select id="size" name="size">
                  <option selected disabled>Choose size</option>
                  <option value="XS">XS</option>
                  <option value="S">S</option>
                  <option value="M">M</option>
                  <option value="L">L</option>
                  <option value="XL">XL</option>
                  <option value="XXL">XXL</option>
              </select>
            </h4>
            </label>
          </div>
         </div>
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <h2>By Mohammed Abdoon</h2>
    </footer>
  </body>
</html>
