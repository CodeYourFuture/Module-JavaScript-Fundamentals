<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="Author: Maryanne Mosonik. This is a page about forms" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form action="#" method="post">
       <div>
         <label for="name">Name</label>
         <input id="name" type="text" minlength="2" required>
       </div>
       <br></br>
       <div>
         <label for="email">Email</label>
         <input id="email" type="email" required>
       </div>
        <br></br>
       <div>
         T-shirt Colour
       </div>
       <div>
         <label for="red">Red</label>
         <input id="red" type="radio" name="colour"required>
       </div>
       <br></br>
       <div>
         <label for="blue">Blue</label>
         <input id="blue" type="radio" name="colour" required>
       </div>
        <br></br>
       <div>
         <label for="green">Green</label>
         <input id="green" type="radio" name="colour" required>
       </div>
        <br></br>
       <div>
         <label for="size">Size Options</label>
          <select id="size" name="SizeOptions" required>
            <option value="" disabled selected>Select your option</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
          </select>
       </div>
        <br></br>
       <button type="reset"> Reset </button>
       <button type="submit">Submit</button>  
      </form>
    </main>
    <footer>
      <p>Maryanne Mosonik</p>
      <p>By HOMEWORK SOLUTION</p>
    </footer>
  </body>
</html>
