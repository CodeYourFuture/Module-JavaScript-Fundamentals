<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <!-- write your html here-->
        <!-- 
          try writing out the requirements first as comments
        this will also help you fill in your PR message later-->
      
      <div class="field">
        <label for="name">Full name: </label>
        <input id="name" name="name" type="text" required auto-complete="name" pattern="/S/S">


      </div>

<div class="field-span">
        <label for="size">Email: </label>
        <input id="email" name="email" type="email" required auto-complete="email" placeholder="your@email.com">


      </div>
      <div class="field">
        <label for="size">Size:</label>
        <select id="size" name="size" >
            <option value="">Choose size..</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>



        </select>
      </div>

      <div class="field">
        <label for="color">Color:</label>
        <select id="color" name="color" >
            <option value="">Choose color..</option>
            <option value="Red">Red</option>
            <option value="Green">Green</option>
            <option value="Light blue">Blue</option>
        </select>
      </div>

      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <p>By Edward kganyago</p>
    </footer>
  </body>
</html>
