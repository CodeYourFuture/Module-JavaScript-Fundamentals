<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T-shirt Order Form</title>
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
      <p>Please fill out the form below to order your custom T-shirt.</p>
    </header>

    <main>
      <form>
        <!-- Full Name -->
        <label for="name">Full Name:</label>
        <input
          type="text"
          id="name"
          name="name"
          required
          minlength="2"
          placeholder="Enter your full name"
        />
        <br /><br />

        <!-- Email -->
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          placeholder="example@email.com"
        />
        <br /><br />

        <!-- T-shirt Colour -->
        <fieldset>
          <legend>Choose a t-shirt colour:</legend>
          <label>
            <input type="radio" name="color" value="red" required />
            Red
          </label>
          <label>
            <input type="radio" name="color" value="blue" />
            Blue
          </label>
          <label>
            <input type="radio" name="color" value="green" />
            Green
          </label>
        </fieldset>
        <br />

        <!-- T-shirt Size -->
        <label for="size"><strong>Choose a size:</strong></label>
        <select id="size" name="size" required>
          <option value="">--Select size--</option>
          <option value="XS">XS</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
        </select>
        <br /><br />

        <!-- Submit -->
        <button type="submit">Submit</button>
      </form>
    </main>

    <footer>
      <p>Form created by Sopyas Solomon for CodeYourFuture coursework.</p>
    </footer>
  </body>
</html>
