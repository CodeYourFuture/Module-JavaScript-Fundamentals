<form>
  <p>
    <label for="name">
      <span>Customer Name: </span>
      <strong><span aria-label="required">*</span></strong>
    </label>
    <input type="text" id="name" name="customer-name" required pattern="[A-Za-z\s\.]+" minlength="2" maxlength="25"/>
  </p>
  <p>
    <label for="email">
      <span>Email: </span>
      <strong><span aria-label="required">*</span></strong>
    </label>
    <input type="email" id="email" name="customer-mail" required minlength="5" maxlength="50" placeholder="example@gmail.com"  />
  </p>
  <p>
  <label for="color preference">
      <span>Color:</span>
    <strong><span aria-label="required">*</span></strong>

      <option value="blue">Blue</option>
      <option value="white">White</option>
      <option value="red">Red</option>
   </select>
  </p>
  <p>
