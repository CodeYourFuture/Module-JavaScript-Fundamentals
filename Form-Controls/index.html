<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta
      name="description"
      content="A product selection form to collect customer preferences and delivery details."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <section>
          <h2>Customer information</h2>
          <fieldset>
            <legend>Identity</legend>
            <label>
              Name:
              <input
                pattern="[A-Za-z\s]{2,}"
                required
                title="Please enter your full name with at least two letters."
              />
            </label>

            <label>
              Email:
              <input
                type="email"
                required
                title="Please enter a valid email address."
                autocomplete="on"
              />
            </label>
          </fieldset>
        </section>

        <section>
          <fieldset>
            <legend>Choose Colour</legend>

            <label>
              <input type="radio" name="colour" value="gold" required />
              Gold
            </label>

            <label>
              <input type="radio" name="colour" value="silver" required />
              Silver
            </label>

            <label>
              <input type="radio" name="colour" value="diamond" required />
              Diamond
            </label>
          </fieldset>
        </section>
        <section>
          <fieldset>
            <legend>Choose Size</legend>
            <label for="size">
              Size:
              <select id="size" name="size" required>
                <option value="" disabled selected>Select a size</option>
                <option value="xs">Extra Small</option>
                <option value="s">Small</option>
                <option value="m">Medium</option>
                <option value="l">Large</option>
                <option value="xl">Extra Large</option>
                <option value="xxl">Extra Extra Large</option>
              </select>
            </label>
          </fieldset>
        </section>
        <section>
          <fieldset>
            <legend>Choose Delivery Date</legend>
            <label>
              Delivery Date:
              <input type="date" min="2025-01-01" max="2025-12-31" required />
            </label>
          </fieldset>
        </section>

        <section>
          <p>
            <button type="submit">Submit Details</button>
          </p>
        </section>
      </form>
    </main>
    <footer>
      <p>© 2025 Abayie</p>
    </footer>
  </body>
</html>
