<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>My form exercise</title>
  <meta name="description" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body>
  <header>
    <h1>Product </h1>
  </header>
  <main>
    <!-- Write a valid form / Test with Devtools/Refactor using Devtools -->

    <form>
      <!-- customer's name/ require-->
      <fieldset>
        <legend>
          <h2> Pick Your T-shirt</h2>
        </legend>
        <p>
          Required fields are followed by
          <strong><span aria-label="required">*</span></strong>
        </p>

        <p>
          <label for="name"><strong>Name *</strong></label>
        </p>
        <input type="text" id="name" name="user_name" required minlength="2" />

        <!-- customer's e-amil/ require-->

        <p><label for="e-mail"><span><strong>E-mail *</strong></span></label>
        </p>
        <input type="email" id="e-mail" name="user_email" required />

        <!-- 3 options colour/ pick only 1/ require -->

        <label for="colour-yellow">
          <p><strong>Colour:</strong></p>
          <input type="radio" style="transform: scale(2)" id="colour-yellow" value="yellow" name="colour" required />
          <span>Yellow </span>
        </label>

        <label for="colour-red">
          <input type="radio" style="transform: scale(2)" id="colour-red" value="red" name="colour" required />
          <span>Red </span>
        </label>

        <label for="colour-blue">
          <input type="radio" style="transform: scale(2)" id="colour-blue" value="blue" name="colour" required />
          <span>Blue </span>
        </label>

        <!--6 options: XS, S, M, L, XL, XXL/ pick only 1 / require-->
        <p><strong>Size:</strong></p>
        <ul>

          <li>
            <label for="size-xs">
              <input type="radio" style="transform: scale(1.5); margin-bottom: 20px;" id="size-xs" name="size"
                value="size-xs" required><span> XS </span>
            </label>
          </li>

          <li>
            <label for="size-s">
              <input type="radio" style="transform: scale(1.5) ; margin-bottom: 20px" ; id="size-s" name="size"
                value="size-s" required><span> S </span>
            </label>
          </li>

          <li>
            <label for="size-m">
              <input type="radio" style="transform: scale(1.5); margin-bottom: 20px" ; id="size-m" name="size"
                value="size-m" required><span> M </span>
            </label>
          </li>

          <li>
            <label for="size-l">
              <input type="radio" style="transform: scale(1.5); margin-bottom: 20px" ; id="size-l" name="size"
                value="size-l" required><span> L </span>
            </label>
          </li>

          <li>
            <label for="size-xl">
              <input type="radio" style="transform: scale(1.5); margin-bottom: 20px" ; id="size-xl" name="size"
                value="size-xl" required><span> XL </span>
            </label>
          </li>

          <li>
            <label for="size-xxl">
              <input type="radio" style="transform: scale(1.5); margin-bottom: 20px" ; id="size-xxl" name="size"
                value="size-xxl" required><span> XXL</span>
            </label>
          </li>
        </ul>
        <button type="submit">Add To Cart </button>
      </fieldset>
    </form>
  </main>
  <footer>
    <!-- change to your name-->
    <h3>By Gisline Della Bella</h3>
  </footer>
</body>

</html>
