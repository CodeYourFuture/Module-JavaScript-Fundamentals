<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>My form control</title>
  <meta name="description" content="F" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
</head>

<body>
  <header>
    <h1></h1>
  </header>
  <main>
    <form>
      <form action="/action_page.php">
      <div>
        <label for="name"> Name: </label>
        <input type="text" id="name" name="name"pattern="^\s*(\S\s*){2,}$" />
      </div>
      <div>
        <label for="email"> Email </label>
        <input type="email" id="email" name="email" />
      </div>
      <fieldset>
        <legend>Please select your color</legend>
        <input type="radio" id="Black" name="color" value="Black">
        <label for="Black">Black</label>
        <input type="radio" id="Beige" name="color" value="Beige">
        <label for="Beige">Beige</label>
        <input type="radio" id="Red" name="color" value="Red">
          <label for="Red">Red</label>
          <br>
          <legend> Please select a size </legend>

          </br>
          <label for="Size">Choose a size:</label>
          <select name="Size" id="Size">
            <option value="">Extra Small</option>
            <option value="small">Small</option>
            <option value="medium">Medium</option>
            <option value="large">Large</option>
            <br>
            <input type="submit" value="Submit">
            <br />
          </select>
      </fieldset>
    </form>
  </main>
  <footer>
    <p>By Mandip</p>
  </footer>
</body>

</html>
