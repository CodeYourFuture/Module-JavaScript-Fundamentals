<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <!-- 
        Requirements:
    - Name: required, at least 2 non-space characters
    - Email: required, valid email format
    - Colour: required, choose 1 of 3 options
    - Size: required, choose 1 of 6 sizes
    - No form action needed for this project
  -->
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" pattern=".*\S.*\S.*" required>
    </div>
    <div class="field">
  <label for="email">Email</label>
  <input type="email" id="email" name="email" required>
</div>
<fieldset>
  <legend>Colour</legend>

  <label>
    <input type="radio" name="colour" value="black" required> Black
  </label>

  <label>
    <input type="radio" name="colour" value="white"> White
  </label>

  <label>
    <input type="radio" name="colour" value="red"> Red
  </label>
</fieldset>
<div class="field">
  <label for="size">Size</label>
  <select id="size" name="size" required>
    <option value="">Select a size</option>
    <option value="XS">XS</option>
    <option value="S">S</option>
    <option value="M">M</option>
    <option value="L">L</option>
    <option value="XL">XL</option>
    <option value="XXL">XXL</option>
  </select>
</div>
    <button type="submit">Submit</button>
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <p>By Lamla Kamana</p>
    </footer>
  </body>
</html>
