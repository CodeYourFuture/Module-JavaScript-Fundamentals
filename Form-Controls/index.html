<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T-Shirt Order Form</title>
  </head>
  <body>
    <header>
      <h1>T-Shirt Sales form</h1>
      <p>Please confirm your details and choose your preferred colour and size.</p>
    </header>
    <main>
      <form aria-label="T-shirt order form">
       <br> 
       <!-- Customer Name -->
        <div>
          <label for="name">Full Name:</label>
          <input
            type="text"
            id="name"
            name="name"
            minlength="2"
            required
            aria-required="true"
            placeholder="Enter your full name"
          />
        </div>
       <br>
 <!-- Customer Email -->
        <div>
          <label for="email">Email Address:</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            aria-required="true"
            placeholder="Enter your email address"
          />
        </div>
       <br> 
<!-- T-shirt Colour -->
        <div>
          <label for="colour">T-shirt Colour:</label>
          <select id="colour" name="colour" required aria-required="true">
            <option value="">Select a colour</option>
            <option value="black">Black</option>
            <option value="white">White</option>
            <option value="blue">Blue</option>
          </select>
        </div>
         <br>
 <!-- T-shirt Size -->
        <fieldset>
          <legend>T-shirt Size:</legend>
         <br>
          <div>
            <input type="radio" id="xs" name="size" value="XS" required />
            <label for="xs">XS</label>
          </div>
         <br>
          <div>
            <input type="radio" id="s" name="size" value="S" />
            <label for="s">S</label>
          </div>
         <br>
          <div>
            <input type="radio" id="m" name="size" value="M" />
            <label for="m">M</label>
          </div>
       <br>
          <div>
            <input type="radio" id="l" name="size" value="L" />
            <label for="l">L</label>
          </div>
         <br>
          <div>
            <input type="radio" id="xl" name="size" value="XL" />
            <label for="xl">XL</label>
          </div>
       <br>
       <div>
            <input type="radio" id="xxl" name="size" value="XXL" />
            <label for="xxl">XXL</label>
          </div>
       <br>
       </fieldset>
       
       <br>
 <!-- Submit Button -->
        <button type="submit">Submit Order</button>
      </form>
    </main>
    <br>
    <footer>
      <p>&copy 2025 Chibuikem Okwu. All rights reserved.</p>
    </footer>
  </body>
</html>
