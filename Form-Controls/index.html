<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="Form for ordering T-Shirts" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick - T-Shirt Order Form</h1>
    </header>
    <main>
      <form>
        <!-- write your html here-->
        <!-- 
        try writing out the requirements first as comments
        this will also help you fill in your PR message later-->
        <!--
        1.What is the customer's name? I must collect this data and ensure it contains at least two non-space characters.
        2.What is the customer's email? I must make sure the email is valid. Email addresses follow a consistent pattern.
        3.What colour should this T-shirt be? I must provide 3 options. How will I ensure they do not choose other colours?
        4.What size does the customer want? I must provide the following 6 options: XS, S, M, L, XL, XXL-->
        <div>
          <label for="name">Full Name</label>
          <input
            id="name"
            name="name"
            type="text"
            required
            pattern=".*\S.*\S.*"
          />
        </div>

        <div>
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" required />
        </div>
        <!--

        <fieldset>
          <legend>Choose your Colour</legend>

          <label for="colour" class="visually-hidden">Colour Choice</label>
          <select id="colour" name="colour" required>
            <option value="">Select Your Colour</option>
            <option value="Burgundy">Burgundy</option>
            <option value="Purple">Purple</option>
            <option value="Yellow">Yellow</option>
          </select>
        </fieldset>

        <fieldset>
          <legend>Size Choice</legend>
          <div>
            <label>
              <input type="radio" name="size" value="XS" required />
              XS
            </label>

            <label>
              <input type="radio" name="size" value="S" />
              S
            </label>

            <label>
              <input type="radio" name="size" value="M" />
              M
            </label>
            <label>
              <input type="radio" name="size" value="L" />
              L
            </label>
            <label>
              <input type="radio" name="size" value="XL" />
              XL
            </label>
            <label>
              <input type="radio" name="size" value="XXL" />
              XXL
            </label>
          </div>
        </fieldset>
