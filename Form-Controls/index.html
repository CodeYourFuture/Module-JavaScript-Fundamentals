<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T-Shirt Order Form</title>
</head>

<body>
  <header>
    <h1>Product Pick</h1>
  </header>

  <main>
     <!--
  Form requirements:
  - HTML only (no CSS or JS)
  - All inputs have associated labels
  - All fields required
  - Valid name (min 2 characters)
  - Valid email address
  - Choose 1 of 3 colors
  - Choose 1 of 6 sizes (XS–XXL)
  - No form action
-->

    <form>
      <fieldset>
        <legend>Customer Details</legend>

        <div>
          <label for="customer">Customer Name</label>
          <input id="customer" name="customerName" type="text" minlength="2" required>
        </div>

        <div>
          <label for="email">Customer Email</label>
          <input id="email" name="customerEmail" type="email" required placeholder="name@example.com">
        </div>
      </fieldset>

      <fieldset>
        <legend>T-Shirt Selection</legend>

        <fieldset>
          <legend>Choose Your Color</legend>

          <div>
            <input type="radio" id="blue" name="colour" value="blue" required>
            <label for="blue">Blue</label>
          </div>

          <div>
            <input type="radio" id="green" name="colour" value="green" required>
            <label for="green">Green</label>
          </div>

          <div>
            <input type="radio" id="red" name="colour" value="red" required>
            <label for="red">Red</label>
          </div>
        </fieldset>

        <div>
          <label for="size">Choose Your Size</label>
          <select id="size" name="size" required>
            <option value="">Choose a size</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
          </select>
        </div>
      </fieldset>

      <button type="submit">Submit Order</button>
    </form>
  </main>

  <footer>
    <p>By Mouawia Elkhalifa</p>
  </footer>
</body>
</html>
