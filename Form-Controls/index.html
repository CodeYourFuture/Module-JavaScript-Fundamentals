<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>

        <!-- Personal Info -->
        <fieldset>
          <legend>Personal Info</legend>

          <div>
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" required minlength="2">
          </div>

          <div>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" required>
          </div>
        </fieldset>

        <!-- Colour Selection -->
        <fieldset>
          <legend>Choose a Colour</legend>

          <label>
            <input type="radio" name="colour" id="red" value="red" required> Red
          </label>
          <label>
            <input type="radio" name="colour" id="green" value="green"> Green
          </label>
          <label>
            <input type="radio" name="colour" id="blue" value="blue"> Blue
          </label>

        </fieldset>

        <!-- Size Selection -->
        <fieldset>
          <legend>Choose a Size</legend>

          <label>
            <input type="radio" name="size" id="xs" value="xs" required> XS
          </label>
          <label>
            <input type="radio" name="size" id="s" value="s"> S
          </label>
          <label>
            <input type="radio" name="size" id="m" value="m"> M
          </label>
          <label>
            <input type="radio" name="size" id="l" value="l"> L
          </label>
          <label>
            <input type="radio" name="size" id="xl" value="xl"> XL
          </label>
          <label>
            <input type="radio" name="size" id="xxl" value="xxl"> XXL
          </label>

        </fieldset>

        <!-- Buttons -->
        <div>
          <button type="reset">Reset</button>
          <button type="submit">Submit</button>
        </div>

      </form>
    </main>
    <footer>
      <h2>By Joanne O'Malley</h2>
    </footer>
  </body>
</html>
