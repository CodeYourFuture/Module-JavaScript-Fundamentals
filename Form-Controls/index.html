<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Get Your T-Shirt</title>
    <meta name="description" content="T-shirt order form" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>T-Shirt Order Form</h1>
      <p>Please enter your details below to order your T-Shirt.</p>
    </header>
    <main>
      <form>
          <fieldset>
          <legend>Customer Information</legend>
          <label for="name">Name:</label>
          <input
            type="text"
            id="name"
            name="name"
            pattern="[A-Za-z\s]+"
            title="Please enter a valid name (letters and spaces only)."
            minlength="2"
            required
          />
          <br /><br />
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            required
          />
        </fieldset>
        <br />
        <fieldset>
          <legend>Product Selection</legend>
          <label for="color">T-shirt Colour:</label>
          <select id="color" name="color" required>         
            <option value="" disabled selected>Select a colour</option>
            <option value="red">Red</option>
            <option value="blue">Blue</option>
            <option value="green">Green</option>
          </select>
          <br /><br />
          <label for="size">T-shirt Size:</label>
          <select id="size" name="size" required>
            <option value="" disabled selected>Select a size</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
          </select>
        </fieldset>
        <br /><br />
        <button type="submit">Submit</button> 
    </main>
    <footer>
      <!-- change to your name-->
      <h2>©Imran Mohamed</h2>
    </footer>
  </body>
</html>
