<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form action = "result.html" method="GET">
        <!-- write your html here-->
        <!-- 
          try writing out the requirements first as comments
        this will also help you fill in your PR message later-->
        <div>
          <label for="name"> Name</label>
          <input type ="text" name ="name" id="name" autocomplete="name" required/> 
        </div>       

        <div> 
          <label for="email"> Email</label>
          <input type="email" name="email" id="email" autocomplete="email" required/>          
        </div>

      
        <div class="colour">
          Colour:
          <div>
            <input type="radio" name="colour" id="green" value="green" required/>
            <label for="green"> Green</label>          

          </div>
          <div>
            <input type="radio" name="colour" id="red" value="red"/>  
            <label for="red"> Red</label>                      
          </div>
          <div>
            <input type="radio" name="colour" id ="yellow" value="yellow"/>     
            <label for="yellow"> Yellow </label>                   
          

        <div>
          <label for="size"> Size</label required>
          <select name="size" id="size">
            <option value=""> -- Please choose a colour -- </option>
            <option value="xs"> XS </option>
            <option value="s"> S </option>
            <option value="m"> M </option>
            <option value="l"> L </option>
            <option value="xl"> XL </option>
            <option value="xxl"> XXL </option>
          </select>        
        </div>

        <div>

          <button style="font-size: 15px" type="reset"> Reset</button>
          <button style="font-size: 15px" type="submit"> Submit</button>
          
        </div>       
        
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <h2>By CHRISTELLE BOTEN</h2>
    </footer>
  </body>
</html>
