<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>

    <main>
      <form>
        <!-- Requirements:
             - Collect customer's name (minimum 2 characters)
             - Collect a valid email address
             - Allow selection of 1 colour from 3 options
             - Allow selection of 1 size from 6 options
             - All fields are required
             - HTML only (no CSS, no JavaScript)
             - No form action
        -->

        <!-- Name -->
        <div>
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            minlength="2"
            placeholder="Roman"
            required
          />
        </div>
        <br />

        <!-- Email -->
        <div>
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@gmial.com"
            required
            minlength="8"
          />
        </div>
        <br />

        <!-- Colour -->
        <div>
          <label for="colour">T-Shirt Colour</label>
          <select id="colour" name="colour" required>
            <option value="" disabled selected>Select a colour</option>
            <option value="red">Red</option>
            <option value="blue">Blue</option>
            <option value="green">Green</option>
          </select>
        </div>
        <br />

        <!-- Size -->
        <fieldset>
          <legend>T-Shirt Size</legend>
          <label for="size">Choose a size</label>
          <select id="size" name="size" required>
            <option value="" disabled selected>Select a size</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
          </select>
        </fieldset>
        <br />

        <button type="submit">Submit</button>
      </form>
    </main>

    <footer>
      <h2>By Ahmad Roman Sanaye</h2>
    </footer>
  </body>
</html>
